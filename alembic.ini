# Alembic configuration (PL-2).
# The URL is intentionally blank — migrations/env.py reads AGENTFOX_DATABASE_URL via
# Settings, so `alembic upgrade head` targets the same database the app does and
# cannot drift from it.
[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
# WARN, not INFO: `agentfox init` and `admin db upgrade` print their own one-line
# result, and alembic's per-revision INFO lines read as noise to someone setting up.
level = WARN
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
