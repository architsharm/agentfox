[project]
name = "agentfox"
version = "0.3.1"
description = "Agent-native, vendor-neutral governance, security and compliance control plane for AI agents in production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Core runtime deps only. Everything that wraps a third-party OSS primitive is an
# optional extra so that `pip install agentfox` stays offline-capable (X-3 / NFR-9).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    # PL-2: migrations are core, not optional. A deployment that cannot be upgraded
    # is not a deployment.
    "alembic>=1.14",
    # Encrypts a connected GitHub account's access token at rest (routes/integrations.py)
    # — core, not optional, the same reasoning as argon2-cffi for password hashing.
    "cryptography>=43",
]

# Where the project lives. Absent until the repository had a stable public name;
# without these, `pip show agentfox` and any package index render the project with
# no link back to its source, which for an Apache-2.0 control plane whose whole
# argument is "read the code that decides" is the wrong omission to ship.
[project.urls]
Homepage = "https://useagentfox.com"
Source = "https://github.com/architsharm/agentfox"
Issues = "https://github.com/architsharm/agentfox/issues"
Changelog = "https://github.com/architsharm/agentfox/releases"

[project.optional-dependencies]
# --- Wrapped OSS primitives (Appendix A.1). All permissive, all swappable. ---
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
classifiers = ["transformers>=4.44", "torch>=2.4"]      # Granite Guardian (Apache-2.0)
rails = ["nemoguardrails>=0.11"]                        # NVIDIA NeMo Guardrails
validators = ["guardrails-ai>=0.5"]                     # Guardrails AI core
redteam = ["garak>=0.10", "pyrit>=0.5"]                 # NVIDIA Garak + Microsoft PyRIT
# I-1: the primary adoption path. Optional so `pip install agentfox` stays light —
# the integration module imports and degrades cleanly without it.
langgraph = ["langgraph>=0.2.60"]
# P9: sqlglot is MIT, zero-dependency and pure Python, so this extra adds no
# transitive surface. Kept optional only because action assurance is opt-in; without
# it, SQL analysis fails closed rather than passing statements through unanalysed.
sql = ["sqlglot>=25.0"]
# I-11: enterprise provider auth. Neither adapter improvises request signing — without
# these they report unavailable rather than pretending to a capability they lack.
bedrock = ["boto3>=1.35"]
vertex = ["google-auth>=2.35"]
# I-7: Prometheus/Grafana is where 4 of 11 already look. The exporter is stdlib-only;
# this extra is only needed for a push gateway.
prometheus = ["prometheus-client>=0.21"]
# I-8: Ragas speaks the vocabulary 3 of 11 already use for retrieval eval.
ragas = ["ragas>=0.2"]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "import-linter>=2.1"]

# Everything permissive, in one shot.
all = ["agentfox[pii,classifiers,rails,validators,redteam,otel,postgres,langgraph,sql]"]
# Cloud provider SDKs are excluded from `all` on purpose: they are large, and most
# deployments need exactly one of them.

# NOT included in `all` on purpose (Appendix A.4): Llama Guard / ShieldGemma carry
# non-OSI licences. Installing this extra is an explicit act, and the adapters
# additionally refuse to load unless NOMETRIA_ACCEPT_RESTRICTED_MODEL_LICENSES=1.
restricted-classifiers = ["transformers>=4.44", "torch>=2.4"]

[project.scripts]
agentfox = "agentfox.apps.cli.main:main"
# Kept so an existing install does not lose its command on upgrade. The docs, the
# harness and the product's own output all say `agentfox`; this is compatibility,
# not a second name we advertise.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfox"]

# `agentfox admin db upgrade` — which the command's own help calls "how a deployed
# instance is upgraded" — died with a raw alembic traceback for everyone who
# installed from PyPI, because the migration scripts live at the repository root
# and the wheel therefore did not carry them. Same shape as the comment on
# `compliance_dir`: a repo-relative path resolves fine from a checkout and finds
# nothing once installed. Copied in under `agentfox/` rather than moved, so the
# repository layout, alembic.ini and CI keep working unchanged.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "agentfox/_migrations"
"alembic.ini" = "agentfox/_alembic.ini"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

# The dependency rule (ARCHITECTURE.md "Layers"): a layer imports only layers below
# it. `lint-imports` checks it in CI's lint job and in `just lint`. An exception is
# listed here by name, with the reason and what removes it, never added silently.
[tool.importlinter]
root_package = "agentfox"
# A type-only import has no runtime edge; `if TYPE_CHECKING:` blocks are excluded.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers: apps > frameworks, exporters, hooks, fixtures > runtime > capabilities > platform > core"
type = "layers"
layers = [
    "agentfox.apps",
    "agentfox.frameworks : agentfox.exporters : agentfox.hooks : agentfox.fixtures",
    "agentfox.runtime",
    "agentfox.capabilities",
    "agentfox.platform",
    "agentfox.core",
]
ignore_imports = [
    # TODO(phase 4): EU_CLASSES moves into the EU AI Act pack, and policy stops
    # reading the risk classes from compliance.
    "agentfox.platform.policy.hierarchy -> agentfox.capabilities.compliance.risk",
    # TODO: the in-process red-team runner and the live-probe adapter drive the
    # Enforcer to measure it. Inject the enforcer (or move these runners above the
    # runtime) so evaluation no longer imports it.
    "agentfox.capabilities.evaluation.redteam -> agentfox.runtime.enforcement",
    "agentfox.capabilities.evaluation.live_probes -> agentfox.runtime.enforcement",
]

[[tool.importlinter.contracts]]
name = "core imports nothing in agentfox outside core"
type = "forbidden"
source_modules = ["agentfox.core"]
forbidden_modules = [
    "agentfox.platform",
    "agentfox.capabilities",
    "agentfox.runtime",
    "agentfox.frameworks",
    "agentfox.exporters",
    "agentfox.hooks",
    "agentfox.fixtures",
    "agentfox.apps",
    "agentfox.errors",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these. Reformatting a shipped revision to satisfy a line
# length is a change to a migration that has already run somewhere, for no
# benefit — and the generated header is over the limit in every one of them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
# The poisoned-skill fixture's `description:` has to stay on one line: that is
# what makes YAML read `IMPORTANT:` as a nested key and raise, which is the
# behaviour the test exists to pin. Wrapping it would make the YAML parse and
# the test would quietly stop testing anything.
"tests/capabilities/discovery/test_skill_scanning.py" = ["E501"]
# E501 only, and only here. The long lines in these trees are *data* — attack
# payloads, model prompts, embedded HTML — where the width carries no
# maintenance cost and rewrapping risks silently altering a string a benchmark
# measures or a red-team demo fires. Every other rule still applies, so an
# unused import or an undefined name in a benchmark still fails CI.
"benchmarks/**" = ["E501"]
"demo/**" = ["E501"]
