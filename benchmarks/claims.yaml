# Every headline number we publish, bound to the result file it came from.
#
# `scripts/check/claims.py --check` renders each claim from its source and fails if any document
# quoting it no longer says exactly that. Two published numbers were corrected by hand in a
# single week (an SPML recall figure and an adaptive attack-success rate) before this existed.
#
# render:
#   fraction      the source value is "n/d" (anything after it, like " (100.0%)", is ignored)
#   sum_fraction  n = numerator, d = numerator + remainder
#   ratio         n = numerator, d = denominator (two integer paths)
#   percent       the source value is a 0..1 fraction; `decimals` sets rounding
#   value         the source value as-is, or `format`ted after multiplying by `scale`
#   fields        several named values: {name: path} or {name: {path, scale, format}}
# Templates may use {n}, {d}, {pct}, {v} or the names under `fields`. Matching ignores markdown
# emphasis and line wraps.
#
# `retired` lists figures that were withdrawn. Binding only checks numbers that are still bound,
# so a superseded headline that a document keeps quoting needs its own check: any listed file that
# still contains the phrase fails the build. A `files` entry may be a glob (`**` recurses), so a
# figure retired from the docs is also caught on any page of the website; a glob that matches no
# file is itself a failure.

# Claim ids are prefixed by the benchmark folder that produces them (`agentdojo.*` comes from
# benchmarks/agentdojo/). The one exception is `jev.*`: the Jev study's numbers live in
# benchmarks/judgment/ with the judgment-tier benchmark, because Jev is that tier's model.

