  - id: agentdojo.label_assigned_benign_utility_prose
    text: "552 of 552 legitimate"
    reason: "label-assigned provenance and duplicated task versions"
    files: [README.md, benchmarks/README.md, docs/benchmarking-whitepaper.md, docs/PRD.md, docs/responding-to-the-critique.md]
  - id: agentdojo.label_assigned_acting_calls
    text: "42/42 attacker calls that act"
    reason: "label-assigned provenance and duplicated task versions"
    files: [README.md, benchmarks/README.md, docs/benchmarking-whitepaper.md, docs/PRD.md, docs/responding-to-the-critique.md]
  - id: agentdojo.label_assigned_acting_calls_prose
    text: "42 of 42 attacker calls that act"
    reason: "label-assigned provenance and duplicated task versions"
