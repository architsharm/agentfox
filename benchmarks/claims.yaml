  - id: containment.attacks_contained_with_detectors_off
    source: benchmarks/containment/results/containment_results.json
    path: [headline, detectors_off_attacks_contained]
    render: fraction
    quoted_in:
      - {file: dashboard/app/docs/reference/detectors/page.tsx, text: "{n}/{d} attack scenarios were contained"}
      - {file: README.md, text: "{n}/{d} attacks contained with zero detector signal"}
      - {file: benchmarks/README.md, text: "{n}/{d} attacks contained with zero detector signal"}
      - {file: docs/evaluation/benchmarking-whitepaper.md, text: "{n}/{d} attack scenarios contained with zero detector signal"}
      - {file: docs/design/PRD.md, text: "{n} of {d} attack scenarios are still contained"}
      - {file: docs/evaluation/responding-to-the-critique.md, text: "{n} of {d} attack scenarios were still contained"}
      - {file: docs/design/architecture-differentiation.md, text: "{n}/{d} attacks contained with zero detector signal"}
      # The blog.
      - {file: dashboard/components/marketing/blog/posts/prompt-injection-containment-not-detection.tsx, text: '{n}/{d} attacks contained with zero detector signal'}
      - {file: dashboard/components/marketing/blog/posts/prompt-injection-containment-not-detection.tsx, text: 'value="{n}/{d}" label="attack scenarios contained with every detector off"'}

