# Every headline number we publish, bound to the result file it came from.
#
# `scripts/claims.py --check` renders each claim from its source and fails if any document
# quoting it no longer says exactly that. Two published numbers were corrected by hand in a
# single week (an SPML recall figure and an adaptive attack-success rate) before this existed.
#
# render:
#   fraction      the source value is "n/d" (anything after it, like " (100.0%)", is ignored)
#   sum_fraction  n = numerator, d = numerator + remainder
#   ratio         n = numerator, d = denominator (two integer paths)
#   percent       the source value is a 0..1 fraction; `decimals` sets rounding
#   value         the source value as-is, or `format`ted after multiplying by `scale`
#   fields        several named values: {name: path} or {name: {path, scale, format}}
# Templates may use {n}, {d}, {pct}, {v} or the names under `fields`. Matching ignores markdown
# emphasis and line wraps.
#
# `retired` lists figures that were withdrawn. Binding only checks numbers that are still bound,
# so a superseded headline that a document keeps quoting needs its own check: any listed file that
# still contains the phrase fails the build.

claims:
  - id: containment.attacks_contained_with_detectors_off
    source: benchmarks/containment/results/containment_results.json
    path: [headline, detectors_off_attacks_contained]
    render: fraction
    quoted_in:
      - {file: README.md, text: "{n}/{d} attacks contained with zero detector signal"}
      - {file: benchmarks/README.md, text: "{n}/{d} attacks contained with zero detector signal"}
      - {file: docs/benchmarking-whitepaper.md, text: "{n}/{d} attack scenarios contained with zero detector signal"}
      - {file: docs/PRD.md, text: "{n} of {d} attack scenarios are still contained"}
      - {file: docs/responding-to-the-critique.md, text: "{n} of {d} attack scenarios were still contained"}

  - id: containment.legitimate_calls_allowed_with_detectors_off
    source: benchmarks/containment/results/containment_results.json
    path: [headline, detectors_off_controls_allowed]
    render: fraction
    quoted_in:
      - {file: README.md, text: "{n}/{d} legitimate calls still allowed"}
      - {file: benchmarks/README.md, text: "{n}/{d} legitimate controls still allowed"}
      - {file: docs/responding-to-the-critique.md, text: "{n} of {d} legitimate calls were still allowed"}

  # AgentDojo: provenance inferred from executed tool outputs (v1.2.2, detectors off). The earlier
  # label-assigned run is retired below.
  - id: agentdojo.session_taint.attack_pairs_contained
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    path: [conditions, inferred_session_taint, attacks_contained, fraction]
    render: fraction
    quoted_in:
      - {file: README.md, text: "{n}/{d} attack pairs contained with session-level taint"}
      - {file: benchmarks/README.md, text: "Session-level taint: {n}/{d} attack pairs contained"}
      - {file: docs/benchmarking-whitepaper.md, text: "{n}/{d} attack pairs contained at session-level taint"}
      - {file: docs/PRD.md, text: "{n} of {d} attack pairs are contained at session-level taint"}
      - {file: docs/responding-to-the-critique.md, text: "{n} of {d} attack pairs were contained at session-level taint"}

  - id: agentdojo.session_taint.benign_tasks_allowed
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      n: [conditions, inferred_session_taint, benign_tasks_allowed, k]
      d: [conditions, inferred_session_taint, benign_tasks_allowed, n]
      pct: {path: [conditions, inferred_session_taint, benign_tasks_allowed, rate], scale: 100, format: ".1f"}
      ci: [conditions, inferred_session_taint, benign_tasks_allowed, ci95]
    quoted_in:
      - {file: README.md, text: "{n}/{d} benign tasks ({pct}% {ci}) run without escalating to a human"}
      - {file: benchmarks/README.md, text: "{n}/{d} benign tasks run without escalation"}
      - {file: docs/benchmarking-whitepaper.md, text: "{n}/{d} benign AgentDojo tasks run without escalation"}
      - {file: docs/benchmarking-whitepaper.md, text: "Session-level taint (shipped default) | {n}/{d} ({pct}% {ci}) | 588/588"}
      - {file: docs/PRD.md, text: "a cost of {n} of {d} benign tasks running without escalation"}
      - {file: docs/responding-to-the-critique.md, text: "{n} of {d} benign tasks ran without escalation"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "Session-level taint (shipped default) | {n}/{d} ({pct}% {ci}) | 588/588 | 702/702"}

  - id: agentdojo.argument_taint
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      bk: [conditions, inferred_argument_taint, benign_tasks_allowed, k]
      bn: [conditions, inferred_argument_taint, benign_tasks_allowed, n]
      bpct: {path: [conditions, inferred_argument_taint, benign_tasks_allowed, rate], scale: 100, format: ".1f"}
      bci: [conditions, inferred_argument_taint, benign_tasks_allowed, ci95]
      ak: [conditions, inferred_argument_taint, attacks_contained, k]
      an: [conditions, inferred_argument_taint, attacks_contained, n]
      ck: [conditions, inferred_argument_taint, acting_calls_contained, k]
      cn: [conditions, inferred_argument_taint, acting_calls_contained, n]
      missed: [conditions, inferred_argument_taint, acting_calls_contained, missed]
    quoted_in:
      - {file: README.md, text: "Per-argument taint: {bk}/{bn} benign tasks, {ak}/{an} attack pairs contained"}
      - {file: README.md, text: "per-argument taint misses {missed} of {cn} attacker write calls"}
      - {file: benchmarks/README.md, text: "Argument-level taint: {ak}/{an} contained, {bk}/{bn} benign tasks"}
      - {file: docs/benchmarking-whitepaper.md, text: "Argument-level taint | {bk}/{bn} | {ak}/{an}"}
      - {file: docs/responding-to-the-critique.md, text: "Per-argument taint ran {bk} of {bn} benign tasks and contained {ak} of {an} attack pairs"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "Argument-level taint | {bk}/{bn} ({bpct}% {bci}) | {ak}/{an} | {ck}/{cn}"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "Argument-level taint misses {missed} attacker calls"}

  - id: agentdojo.argument_taint_tiered
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      bk: [conditions, inferred_argument_taint_tiered, benign_tasks_allowed, k]
      bn: [conditions, inferred_argument_taint_tiered, benign_tasks_allowed, n]
      bpct: {path: [conditions, inferred_argument_taint_tiered, benign_tasks_allowed, rate], scale: 100, format: ".1f"}
      bci: [conditions, inferred_argument_taint_tiered, benign_tasks_allowed, ci95]
      ak: [conditions, inferred_argument_taint_tiered, attacks_contained, k]
      an: [conditions, inferred_argument_taint_tiered, attacks_contained, n]
    quoted_in:
      - {file: docs/benchmarking-whitepaper.md, text: "Argument-level taint, read-only tools exempt | {bk}/{bn} | {ak}/{an}"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "Argument-level taint, read-only tools exempt | {bk}/{bn} ({bpct}% {bci}) | {ak}/{an}"}

  - id: agentdojo.oracle_upper_bound
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      b: [conditions, oracle_labels, benign_tasks_allowed, fraction]
      a: [conditions, oracle_labels, attacks_contained, fraction]
    quoted_in:
      - {file: README.md, text: "Taking provenance from the benchmark's own labels gives {b} and {a}"}
      - {file: benchmarks/README.md, text: "the same replay gives {b} and {a}"}
      - {file: docs/benchmarking-whitepaper.md, text: "Taken from the benchmark's labels (upper bound) | {b} | {a}"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "Taken from the benchmark's labels (upper bound) | {b} | {a}"}

  - id: agentdojo.capability_only
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      b: [conditions, capability_only, benign_tasks_allowed, fraction]
      a: [conditions, capability_only, attacks_contained, fraction]
      ck: [conditions, capability_only, acting_calls_contained, k]
      cn: [conditions, capability_only, acting_calls_contained, n]
    quoted_in:
      - {file: docs/benchmarking-whitepaper.md, text: "None (grants and impact tiers only) | {b} | {a}"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "None: grants and impact tiers only | {b} | {a} | {ck}/{cn}"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "contain {ck} of {cn} attacker write calls"}

  - id: agentdojo.legitimate_actions_escalated
    source: benchmarks/agentdojo_e2e/results/inferred_provenance_summary.json
    render: fields
    fields:
      k: [benign_acting_calls_escalated_argument_tiered, k]
      n: [benign_acting_calls_escalated_argument_tiered, n]
      pct: {path: [benign_acting_calls_escalated_argument_tiered, rate], scale: 100, format: ".0f"}
    quoted_in:
      - {file: docs/benchmarking-whitepaper.md, text: "{pct}% of AgentDojo's legitimate write and irreversible calls copy a value out of a tool output"}
      - {file: benchmarks/agentdojo_e2e/README.md, text: "{k} of {n} legitimate write and irreversible calls ({pct}%) are still escalated"}

  - id: adaptive.readable_attack_success_at_50
    source: benchmarks/adaptive/results/adaptive_summary.json
    path: [asr, "indirect_retrieved/readable_only", "asr@50"]
    render: percent
    decimals: 0
    quoted_in:
      - {file: README.md, text: "{pct}% of the attacks we catch through within 50 attempts"}
      - {file: benchmarks/README.md, text: "{pct}% attack success at 50 attempts"}
      - {file: docs/benchmarking-whitepaper.md, text: "{pct}% at a 50-attempt budget"}
      - {file: docs/PRD.md, text: "{pct}% at 50 attempts"}
      - {file: docs/responding-to-the-critique.md, text: "{pct}% at 50 attempts"}

  - id: adaptive.bypasses_contained_at_the_action
    source: benchmarks/adaptive/results/adaptive_summary.json
    path: [containment_pairing, headline]
    render: fraction
    quoted_in:
      - {file: benchmarks/README.md, text: "{n}/{d} of those bypasses still contained"}
      - {file: docs/benchmarking-whitepaper.md, text: "{n}/{d} were still contained at the action"}

  - id: crescendo.trajectory_detection
    source: benchmarks/crescendo/results/crescendo_results.json
    path: [headline, trajectory_detection]
    render: fraction
    quoted_in:
      - {file: benchmarks/README.md, text: "{n}/{d} detected"}

  - id: crescendo.control_false_positives
    source: benchmarks/crescendo/results/crescendo_results.json
    path: [headline, control_false_positives_trajectory]
    render: fraction
    quoted_in:
      - {file: benchmarks/README.md, text: "control false positives still {n}/{d}"}

  - id: multilingual.integrity_parity
    source: benchmarks/multilingual/results/multilingual_parity.json
    render: sum_fraction
    numerator: [integrity_parity, parity_held]
    remainder: [integrity_parity, parity_broken]
    quoted_in:
      - {file: benchmarks/README.md, text: "{n}/{d} matched pairs"}

  - id: generalization.classifier_spml_recall
    source: benchmarks/results_generalization/summary.json
    path: [configs, heuristic_classifier, spml, recall]
    render: percent
    decimals: 1
    quoted_in:
      - {file: README.md, text: "reaches {pct}% and"}
      - {file: docs/benchmarking-whitepaper.md, text: "recall of {pct}% and"}

  # --- Judgment tiers (opt-in; a default install scores the "off" column) ---
  - id: judgment.escaped_payloads_caught
    source: benchmarks/judgment/results/judgment_results.json
    path: [areas, injection, escaped_payloads_caught]
    render: fraction
    quoted_in:
      - {file: README.md, text: "{n}/{d} of the injection payloads that defeated our own pattern detectors"}
      - {file: benchmarks/README.md, text: "{n}/{d} injection payloads that defeated our pattern detectors"}
      - {file: benchmarks/judgment/README.md, text: "**{n} of {d} injection payloads that escaped the shipping detectors are caught**"}

  - id: judgment.contested_recall_off
    source: benchmarks/judgment/results/judgment_results.json
    path: [areas, answerability, contested_recall_off]
    render: fraction
    quoted_in:
      - {file: README.md, text: "abstains on {n}/{d} contested questions"}
      - {file: benchmarks/judgment/README.md, text: "abstains on **{n}/{d}** contested questions"}

  - id: judgment.contested_recall_on
    source: benchmarks/judgment/results/judgment_results.json
    path: [areas, answerability, contested_recall_on]
    render: fraction
    quoted_in:
      - {file: README.md, text: "with a judgment tier that becomes {n}/{d}"}
      - {file: benchmarks/judgment/README.md, text: "with a judgment tier that becomes **{n}/{d}**"}

  - id: judgment.sql_control_unchanged
    source: benchmarks/judgment/results/judgment_results.json
    # "on" must be quoted: YAML 1.1 parses the bare word as boolean true,
    # which silently turns this path into [areas, ..., True, accuracy].
    path: [areas, sql_blast_radius_control, "on", accuracy]
    render: percent
    decimals: 1
    quoted_in:
      - {file: benchmarks/judgment/README.md, text: "**F1 {pct}**"}

  - id: answerability.prediction_recall
    source: benchmarks/answerability/results/kuq_summary.json
    path: [categories, future_unknown, recall]
    render: percent
    decimals: 1
    quoted_in:
      - {file: benchmarks/README.md, text: "`PREDICTION` recall 39.0%→{pct}%"}
      - {file: benchmarks/answerability/README.md, text: "`future_unknown` | 659 | Recall | 39.0% | 69.0% | {pct}% |"}

  - id: answerability.opinion_recall
    source: benchmarks/answerability/results/kuq_summary.json
    path: [categories, controversial, recall]
    render: percent
    decimals: 2
    quoted_in:
      - {file: benchmarks/README.md, text: "`OPINION` 0.74%→{pct}%"}
      - {file: benchmarks/answerability/README.md, text: "`controversial` | 676 | Recall | 0.74% | 5.62% | {pct}% |"}

  - id: answerability.known_over_refusal
    source: benchmarks/answerability/results/kuq_summary.json
    path: [categories, known, over_refusal_rate]
    render: percent
    decimals: 2
    quoted_in:
      - {file: benchmarks/README.md, text: "over-refusal on known questions 0.90%→{pct}%"}
      - {file: benchmarks/answerability/README.md, text: "`known` | 3,447 | Over-refusal rate | 0.90% | 0.99% | {pct}% |"}

  - id: redteam.tool_scope_escapes
    source: benchmarks/redteam/results/adaptive_redteam_summary.json
    render: ratio
    numerator: [by_mutation_class, tool_scope, escapes]
    denominator: [by_mutation_class, tool_scope, attempts]
    quoted_in:
      - {file: benchmarks/README.md, text: "`tool_scope` {n}/{d}"}
      - {file: benchmarks/redteam/README.md, text: "`tool_scope` {n}/{d} (was 0/25)"}

  - id: redteam.provenance_escapes
    source: benchmarks/redteam/results/adaptive_redteam_summary.json
    render: ratio
    numerator: [by_mutation_class, provenance, escapes]
    denominator: [by_mutation_class, provenance, attempts]
    quoted_in:
      - {file: benchmarks/README.md, text: "`provenance` {n}/{d}"}

  - id: redteam.structural_escapes_after_fix
    source: benchmarks/redteam/results/adaptive_redteam_summary.json
    render: ratio
    numerator: [by_semantics, structural, escapes]
    denominator: [by_semantics, structural, attempts]
    quoted_in:
      - {file: benchmarks/README.md, text: "`structural` {n}/{d} after"}
      - {file: benchmarks/redteam/README.md, text: "`structural` {n}/{d}, `readable` 3/39"}

  - id: action_safety.agentdojo_attacker_calls_flagged
    source: benchmarks/action_safety/results/agentdojo_summary.json
    render: ratio
    numerator: [injection, flagged]
    denominator: [injection, n]
    quoted_in:
      - {file: benchmarks/README.md, text: "flagged {n}/{d} attacker"}

  - id: action_safety.agentdojo_benign_calls_flagged
    source: benchmarks/action_safety/results/agentdojo_summary.json
    render: ratio
    numerator: [user, flagged]
    denominator: [user, n]
    quoted_in:
      - {file: benchmarks/README.md, text: "and {n}/{d} benign calls"}

  - id: jev.safepyramid_unseen_2400
    source: scripts/final_numbers.json
    render: fields
    fields:
      n: ["CHOSEN, unseen 2,400 cases", n]
      t: ["CHOSEN, unseen 2,400 cases", trivial]
      acc: ["CHOSEN, unseen 2,400 cases", acc]
      prec: ["CHOSEN, unseen 2,400 cases", prec]
      rec: ["CHOSEN, unseen 2,400 cases", rec]
      f1: ["CHOSEN, unseen 2,400 cases", f1]
    quoted_in:
      - {file: docs/jev-final-numbers.md, text: "CHOSEN, unseen 2,400 cases {n} {t}% {acc}% {prec}% {rec}% {f1}"}

  - id: jev.agent_trajectories_held_out
    source: scripts/final_numbers.json
    render: fields
    fields:
      n: ["HELD-OUT: >=2 of 6 @0.6", n]
      acc: ["HELD-OUT: >=2 of 6 @0.6", acc]
      prec: ["HELD-OUT: >=2 of 6 @0.6", prec]
      rec: ["HELD-OUT: >=2 of 6 @0.6", rec]
      f1: ["HELD-OUT: >=2 of 6 @0.6", f1]
    quoted_in:
      - {file: docs/jev-final-numbers.md, text: "HELD-OUT: >=2 of 6 @0.6 {n}"}
      - {file: docs/jev-final-numbers.md, text: "F1 {f1} on the held-out half of 2,571 external trajectories (precision {prec}%, recall {rec}%)"}
      - {file: docs/jev-final-numbers.md, text: "F1 {f1} on the held-out half** and"}

  - id: jev.refund_routed
    source: scripts/final_numbers.json
    render: fields
    fields:
      r1: ["R1 whole policy, one judgment", acc]
      r3: ["R3 routed: code owns predicates", acc]
    quoted_in:
      - {file: docs/jev-final-numbers.md, text: "R1 whole policy, one judgment 2,160 68.3% {r1}%"}
      - {file: docs/jev-final-numbers.md, text: "R3 routed: code owns predicates 2,160 68.3% {r3}%"}

