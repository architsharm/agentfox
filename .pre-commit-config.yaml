# Install once with `pre-commit install` (after `pip install pre-commit`, or
# `uvx pre-commit install`). See CONTRIBUTING.md, "Vendored wheels".
repos:
  - repo: local
    hooks:
      - id: rebuild-vendored-wheels
        name: rebuild vendored wheels if src/agentfox changed
        entry: python3 scripts/rebuild_vendored_wheels.py
        language: system
        files: ^src/agentfox/.*\.py$
        pass_filenames: false
