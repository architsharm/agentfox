      iso-42001: ["A.2 — AI policy"]
      soc2: ["CC5.2", "CC8.1"]

  - key: NOM-GOV-02
    title: Controls are mapped to applicable frameworks and maintained
    objective: >
      Platform controls are mapped to the regulatory and standards frameworks in scope,
      versioned, and maintained as those frameworks change.
    family: NOM-GOV
    pillar: 6
    implemented_by: [P6-2, P6-8]
    evidence_sources: [controls, framework_mappings]
