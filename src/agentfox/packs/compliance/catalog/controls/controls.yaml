    mappings:
      eu-ai-act: ["Art. 17", "Art. 72"]
      nist-ai-rmf: ["MANAGE 4.1", "MEASURE 1.1"]
      iso-42001: ["A.6"]
      soc2: ["CC4.1 — monitoring activities"]

  - key: NOM-GOV-05
    title: Regulatory obligations are tracked against the agent inventory
