      iso-42001: ["A.3"]
      soc2: ["CC2.2", "CC4.2"]

# Declared gaps — rendered in the product next to every coverage claim.
# A compliance product that claims total coverage fails its first serious audit
# conversation (Appendix B §B.4).
gaps:
  eu-ai-act:
    - "Conformity assessment procedure (Art. 43), CE marking and notified-body interaction"
    - "Registration in the EU database (Art. 49)"
    - "Fundamental rights impact assessment content (Art. 27) — we provide inputs, not the filing"
  nist-ai-rmf:
    - "Organisational culture and workforce items under GOVERN 3-4 that are not technical"
  iso-42001:
    - "Clauses 4-10 management-system requirements (context, leadership, competence, internal audit, management review) — an AIMS programme, not a platform"
  soc2:
    - "The customer's own entity-level controls; this platform supports their evidence, it is not their SOC 2"
  owasp-llm:
    - "LLM04 Data and Model Poisoning — partially addressed; we detect downstream symptoms, not training-pipeline integrity"
    - "LLM08 Vector and Embedding Weaknesses — partially addressed; we do not secure the embedding store"
  owasp-agentic:
    - "T11 Unexpected Remote Code Execution — a sandbox concern, explicitly out of scope (PRD 2.3)"
    - "T14 Human Attacks on Multi-Agent Systems"
    - "T15 Human Manipulation"
  mitre-atlas:
    - "Training-time and model-supply-chain techniques are out of scope"
