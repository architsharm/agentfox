    pillar: 6
    implemented_by: [P6-5]
    evidence_sources: [obligations]
    status_rule:
      kind: presence
      requires: [obligations]
    mappings:
      eu-ai-act: ["Art. 6", "Art. 50", "Art. 111 — transitional provisions"]
      nist-ai-rmf: ["GOVERN 1.1"]
      iso-42001: ["A.2"]
      soc2: ["CC2.1"]

  - key: NOM-GOV-06
    title: Aggregate AI risk posture is reported to executive level
    objective: >
      Agent population, control effectiveness, open findings and compliance posture are
      reported to executive or board level on a defined cadence.
    family: NOM-GOV
    pillar: 6
    implemented_by: [P6-6]
    evidence_sources: [control_statuses, findings]
    status_rule:
      kind: presence
      requires: [control_statuses]
    mappings:
      eu-ai-act: ["Art. 17", "Art. 26"]
