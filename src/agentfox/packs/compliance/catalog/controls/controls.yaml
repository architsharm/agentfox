      degraded_at: 0.6
    mappings:
      eu-ai-act: ["Art. 9 — risk management system", "Art. 6 — classification rules", "Art. 27 — fundamental rights impact assessment"]
      nist-ai-rmf: ["MAP 1.5", "MAP 5.1", "GOVERN 1.3"]
      iso-42001: ["A.5 — AI system impact assessment"]
      soc2: ["CC3.2", "CC3.4"]

  - key: NOM-GOV-04
    title: Control effectiveness is monitored continuously from telemetry
    objective: >
      Each control's status is computed from operational telemetry rather than
