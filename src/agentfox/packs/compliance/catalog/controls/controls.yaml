      nist-ai-rmf: ["GOVERN 1.1"]
      iso-42001: ["A.2", "A.8"]
      soc2: ["CC2.1", "CC3.1"]

  - key: NOM-GOV-03
    title: Each agent is risk-assessed and classified
    objective: >
      Every agent is risk-assessed, classified against the EU AI Act risk categories,
      and carries recorded mitigations, residual risk and a review date.
