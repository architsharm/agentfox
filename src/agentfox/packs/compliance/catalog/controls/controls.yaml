# AgentFox control catalog
# =========================
# Human-readable source of truth: docs/design/control-catalog.md
#
# Content, not code (PRD R6): frameworks change — the EU AI Act omnibus delay is the
# live example — so mappings are versioned data that ship without a release.
#
# ⚠ EVERY MAPPING HERE IS review_status: draft. These are informed engineering
# drafts produced from the framework texts. They are NOT legal advice and have not
# been reviewed by compliance counsel or a certification body. Draft mappings are
# badged in the UI and ship inside evidence packages tagged with a
# "DRAFT — UNVERIFIED / NOT LEGAL ADVICE" chip rather than being excluded
# (Appendix B §B.6), so reviewers can see exactly what is still outstanding.
version: 0.1.0-draft
review_status: draft
frameworks:
  eu-ai-act: EU Artificial Intelligence Act (Reg. (EU) 2024/1689, post-omnibus timeline Aug 2026)
  nist-ai-rmf: NIST AI Risk Management Framework 1.0 + Generative AI Profile (NIST-AI-600-1)
  iso-42001: ISO/IEC 42001:2023 (Annex A controls)
  soc2: AICPA SOC 2 Trust Services Criteria (2017, rev. 2022)
  owasp-llm: OWASP Top 10 for LLM Applications (2025)
  owasp-agentic: OWASP Agentic AI Threats & Mitigations (T1-T15)
  mitre-atlas: MITRE ATLAS

controls:

  # --- Pillar 1 · Discovery & Inventory ---------------------------------
  - key: NOM-DSC-01
    title: Complete and current inventory of every AI agent
    objective: >
      A complete, current inventory of every AI agent operating in the environment is
      maintained, including the models, tools and data sources each one uses.
    family: NOM-DSC
    pillar: 1
    implemented_by: [P1-1]
    evidence_sources: [agents, traces]
    status_rule:
      kind: ratio
      numerator: registered_agents
      denominator: total_agents
      effective_at: 0.95
      degraded_at: 0.7
    mappings:
      eu-ai-act: ["Art. 11 — technical documentation"]
      nist-ai-rmf: ["MAP 1.1", "GOVERN 1.6"]
      iso-42001: ["A.6 — AI system lifecycle", "A.4 — resources"]
      soc2: ["CC3.2"]
      owasp-agentic: ["T13 Rogue Agents"]

  - key: NOM-DSC-02
    title: Ungoverned (shadow) agents are detected and reported
    objective: >
      Agent activity that does not correlate to a registered agent is detected from
      telemetry and raised as a finding with the evidence needed to act on it.
    family: NOM-DSC
    pillar: 1
    implemented_by: [P1-2]
    evidence_sources: [findings, traces]
    status_rule:
      kind: capability_active
      requires: [traces]
      open_findings_degrade: [shadow_agent]
    mappings:
      eu-ai-act: ["Art. 26 — deployer obligations"]
      nist-ai-rmf: ["MAP 1.1", "MANAGE 4.1"]
      iso-42001: ["A.9 — use of AI systems"]
      soc2: ["CC7.2"]
      owasp-agentic: ["T13 Rogue Agents"]

  - key: NOM-DSC-03
    title: Every agent has an accountable owner and risk tier
    objective: >
      Each agent records a named accountable owner, a business purpose and an assigned
      risk tier. Unowned agents are a reportable finding.
    family: NOM-DSC
    pillar: 1
    implemented_by: [P1-4]
    evidence_sources: [agents]
    status_rule:
      kind: ratio
      numerator: owned_agents
      denominator: total_agents
      effective_at: 1.0
      degraded_at: 0.8
    mappings:
      eu-ai-act: ["Art. 9 — risk management system", "Art. 26"]
      nist-ai-rmf: ["GOVERN 2.1", "MAP 1.1"]
      iso-42001: ["A.3 — internal organisation"]
      soc2: ["CC1.3", "CC3.2"]

  - key: NOM-DSC-04
    title: Dependencies are mapped from observed behaviour
    objective: >
      The relationships between agents, models, tools, data sources and sub-agents are
      mapped from what the agents actually do, not from self-reported configuration,
      and support blast-radius queries.
    family: NOM-DSC
    pillar: 1
    implemented_by: [P1-3, P1-7]
    evidence_sources: [lineage_edges]
    status_rule:
      kind: presence
      requires: [lineage_edges]
    mappings:
      eu-ai-act: ["Art. 11", "Art. 15 — accuracy, robustness and cybersecurity"]
      nist-ai-rmf: ["MAP 2.1", "MAP 4.1"]
      iso-42001: ["A.6", "A.10 — third-party relationships"]
      soc2: ["CC3.2", "CC9.2"]
      owasp-llm: ["LLM03 Supply Chain"]
      owasp-agentic: ["T12 Agent Communication Poisoning"]

  - key: NOM-DSC-05
    title: Third-party tool and MCP surfaces are monitored for drift and injection
    objective: >
      MCP servers and external tool surfaces are inventoried, snapshotted, and checked
      for silent schema changes and instructions embedded in tool metadata.
    family: NOM-DSC
    pillar: 1
    implemented_by: [P1-5]
    evidence_sources: [mcp_tool_snapshots, findings]
    status_rule:
      kind: freshness
      table: mcp_tool_snapshots
      max_age_days: 30
      open_findings_degrade: [tool_poisoning, schema_drift]
    mappings:
      eu-ai-act: ["Art. 15", "Art. 25 — responsibilities along the value chain"]
      nist-ai-rmf: ["MAP 4.1", "MEASURE 2.7"]
      iso-42001: ["A.10"]
      soc2: ["CC9.2"]
      owasp-llm: ["LLM03 Supply Chain"]
      owasp-agentic: ["T2 Tool Misuse"]
      mitre-atlas: ["AML.T0053 LLM Plugin Compromise"]

  # --- Pillar 2 · Identity & Access -------------------------------------
  - key: NOM-IAM-01
    title: Every agent holds a governed non-human identity
    objective: >
      Each agent has a unique machine identity with a managed lifecycle: issuance,
      rotation, revocation, expiry, and posture assessment.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-1]
    evidence_sources: [identities, credentials]
    status_rule:
      kind: ratio
      numerator: agents_with_identity
      denominator: total_agents
      effective_at: 0.95
      degraded_at: 0.6
      open_findings_degrade: [stale_identity, over_privileged, orphaned_identity]
    mappings:
      eu-ai-act: ["Art. 15 — cybersecurity"]
      nist-ai-rmf: ["GOVERN 1.5", "MANAGE 2.2"]
      iso-42001: ["A.3", "A.9"]
      soc2: ["CC6.1", "CC6.2", "CC6.3"]
      owasp-agentic: ["T9 Identity Spoofing & Impersonation"]
      mitre-atlas: ["AML.T0055 Unsecured Credentials"]

  - key: NOM-IAM-02
    title: Tool access is least-privilege and default-deny
    objective: >
      Agent access to tools and actions is explicitly granted, evaluated on every call
      including argument-level constraints, and denied by default.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-2]
    evidence_sources: [decisions, capabilities]
    status_rule:
      kind: decision_coverage
      surface: tool_args
      effective_at: 0.99
      degraded_at: 0.9
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MANAGE 2.2", "GOVERN 1.5"]
      iso-42001: ["A.9"]
      soc2: ["CC6.1", "CC6.3"]
      owasp-llm: ["LLM06 Excessive Agency"]
      owasp-agentic: ["T3 Privilege Compromise"]

  - key: NOM-IAM-03
    title: High-impact actions require documented human approval
    objective: >
      Actions classified as high-impact or irreversible are suspended pending an
      approval recorded with the approver's identity and rationale. Unanswered
      approvals fail closed.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-3]
    evidence_sources: [approval_requests]
    status_rule:
      kind: capability_active
      requires: [approval_requests]
    mappings:
      eu-ai-act: ["Art. 14 — human oversight"]
      nist-ai-rmf: ["GOVERN 3.2", "MANAGE 2.3"]
      iso-42001: ["A.9"]
      soc2: ["CC5.2"]
      owasp-llm: ["LLM06 Excessive Agency"]
      owasp-agentic: ["T10 Overwhelming Human-in-the-Loop"]

  - key: NOM-IAM-04
    title: Control-plane access is authenticated and role-based
    objective: >
      Access to the governance platform itself is authenticated, role-based, and
      provisioned through the organisation's identity system.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-4]
    evidence_sources: [users, api_tokens]
    status_rule:
      kind: presence
      requires: [users]
    mappings:
      eu-ai-act: ["Art. 26"]
      nist-ai-rmf: ["GOVERN 2.1"]
      iso-42001: ["A.3"]
      soc2: ["CC6.1", "CC6.2", "CC6.6"]

  - key: NOM-IAM-05
    title: Delegated authority is narrowed, never widened
    objective: >
      When an agent delegates to a sub-agent, the child's capabilities are a subset of
      the parent's, enforced at write time, and the delegation chain is recorded.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-5]
    evidence_sources: [delegation_edges]
    status_rule:
      kind: capability_active
      requires: [delegation_edges]
      optional: true
    mappings:
      eu-ai-act: ["Art. 14", "Art. 15"]
      nist-ai-rmf: ["MANAGE 2.2"]
      iso-42001: ["A.9"]
      soc2: ["CC6.3"]
      owasp-llm: ["LLM06 Excessive Agency"]
      owasp-agentic: ["T3 Privilege Compromise"]

  - key: NOM-IAM-06
    title: Policy changes are simulated and reviewed before enforcement
    objective: >
      A candidate policy change is replayed against recorded traffic and its effect
      reviewed before it takes effect in production.
    family: NOM-IAM
    pillar: 2
    implemented_by: [P2-7]
    evidence_sources: [simulation_runs, policy_versions]
    status_rule:
      kind: capability_active
      requires: [policy_versions]
    mappings:
      eu-ai-act: ["Art. 17 — quality management system"]
      nist-ai-rmf: ["MANAGE 4.1", "GOVERN 1.2"]
      iso-42001: ["A.6"]
      soc2: ["CC8.1 — change management"]

  # --- Pillar 3 · Runtime Guardrails ------------------------------------
  - key: NOM-RTG-01
    title: Prompt injection and jailbreak attempts are detected and blocked
    objective: >
      Injection and jailbreak attempts are detected and blocked on every untrusted
      input surface, including content arriving indirectly via retrieval or tool results.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-1]
    evidence_sources: [detector_runs, decisions]
    status_rule:
      kind: detector_coverage
      detector: injection.heuristic
      effective_at: 0.99
      degraded_at: 0.9
    mappings:
      eu-ai-act: ["Art. 15 — robustness and cybersecurity"]
      nist-ai-rmf: ["MEASURE 2.7", "MANAGE 2.2"]
      iso-42001: ["A.6"]
      soc2: ["CC6.6", "CC7.2"]
      owasp-llm: ["LLM01 Prompt Injection"]
      owasp-agentic: ["T6 Intent Breaking & Goal Manipulation"]
      mitre-atlas: ["AML.T0051 LLM Prompt Injection", "AML.T0054 LLM Jailbreak"]

  - key: NOM-RTG-02
    title: Personal and sensitive data is detected and controlled in both directions
    objective: >
      Personal and sensitive data is detected in content entering the model and in
      content leaving it, and is redacted, tokenised or blocked per policy.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-2]
    evidence_sources: [detector_runs, detection_findings]
    status_rule:
      kind: detector_coverage
      detector: pii.native
      alternatives: [pii.presidio]
      effective_at: 0.99
      degraded_at: 0.9
    mappings:
      eu-ai-act: ["Art. 10 — data and data governance"]
      nist-ai-rmf: ["MEASURE 2.10", "MANAGE 2.2"]
      iso-42001: ["A.7 — data for AI systems"]
      soc2: ["CC6.7"]
      owasp-llm: ["LLM02 Sensitive Information Disclosure"]
      mitre-atlas: ["AML.T0057 LLM Data Leakage"]

  - key: NOM-RTG-03
    title: Credentials and secrets are prevented from transiting the agent
    objective: >
      API keys, tokens, private keys and other credentials are detected in prompts,
      outputs and tool arguments and prevented from leaking.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-3]
    evidence_sources: [detector_runs, detection_findings]
    status_rule:
      kind: detector_coverage
      detector: secrets.native
      effective_at: 0.99
      degraded_at: 0.9
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MEASURE 2.7"]
      iso-42001: ["A.7"]
      soc2: ["CC6.1", "CC6.7"]
      owasp-llm: ["LLM02 Sensitive Information Disclosure"]
      mitre-atlas: ["AML.T0055 Unsecured Credentials"]

  - key: NOM-RTG-04
    title: Tool invocations are authorised against intent and argument provenance
    objective: >
      Tool calls are authorised on the full execution path — the tool, its arguments,
      and where those arguments came from — so that untrusted content cannot reach a
      high-impact tool without approval.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-4]
    evidence_sources: [decisions, taint_tags]
    status_rule:
      kind: decision_coverage
      surface: tool_args
      effective_at: 0.99
      degraded_at: 0.9
    mappings:
      eu-ai-act: ["Art. 14", "Art. 15"]
      nist-ai-rmf: ["MANAGE 2.2"]
      iso-42001: ["A.9"]
      soc2: ["CC6.3"]
      owasp-llm: ["LLM01 Prompt Injection", "LLM06 Excessive Agency"]
      owasp-agentic: ["T2 Tool Misuse", "T6 Intent Breaking & Goal Manipulation"]
      mitre-atlas: ["AML.T0053 LLM Plugin Compromise"]

  - key: NOM-RTG-05
    title: Content is screened against a documented safety policy
    objective: >
      Model input and output are screened against a documented content-safety policy
      with category-level scoring.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-5]
    evidence_sources: [detector_runs]
    status_rule:
      kind: detector_coverage
      detector: safety.lexicon
      alternatives: [safety.granite, safety.restricted]
      effective_at: 0.95
      degraded_at: 0.8
    mappings:
      eu-ai-act: ["Art. 15", "Art. 50 — transparency obligations"]
      nist-ai-rmf: ["MEASURE 2.6", "MEASURE 2.11"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      owasp-llm: ["LLM09 Misinformation"]
      owasp-agentic: ["T7 Misaligned & Deceptive Behaviors"]

  - key: NOM-RTG-06
    title: Enforcement operates within a documented latency budget
    objective: >
      Inline enforcement runs within its stated latency budget. Degradation is
      detected and recorded as a finding rather than silently skipped.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-6, P3-7, P3-11]
    evidence_sources: [detector_runs, findings]
    status_rule:
      kind: degradation
      max_degraded_ratio: 0.01
      degraded_ratio_warn: 0.05
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MEASURE 2.5"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2", "A1.1 — availability"]
      owasp-agentic: ["T4 Resource Overload"]

  - key: NOM-RTG-07
    title: Model output conforms to its declared contract
    objective: >
      Where an output contract is declared, output is validated against it and
      violations are repaired, retried or blocked.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-9]
    evidence_sources: [detector_runs]
    status_rule:
      kind: capability_active
      requires: [detector_runs]
      optional: true
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MEASURE 2.5"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      owasp-llm: ["LLM05 Improper Output Handling"]

  - key: NOM-IAM-07
    title: Answers contain only what the requesting human may see
    objective: >
      The end-user principal is propagated through the agent into retrieval; content
      the principal is not entitled to is withheld before generation and the
      withholding is recorded; restricted classes require an explicit clearance rather
      than a grant; and over-permissioned retrieval is measured continuously.
    family: NOM-IAM
    pillar: 10
    implemented_by: [P10-1, P10-2, P10-3, P10-4, P10-6, P10-7, P10-8, P10-9]
    evidence_sources: [disclosure_events, end_user_principals]
    status_rule:
      kind: presence
      requires: [end_user_principals]
      open_findings_degrade:
        [entitlement_disclosure, aggregation_disclosure, inference_disclosure]
    mappings:
      eu-ai-act: ["Art. 10 — data governance", "Art. 15"]
      nist-ai-rmf: ["MAP 4.1", "MANAGE 2.2"]
      iso-42001: ["A.5", "A.8"]
      soc2: ["CC6.1", "CC6.3"]
      owasp-llm: ["LLM02 Sensitive Information Disclosure", "LLM06 Excessive Agency"]

  - key: NOM-RTG-12
    title: Answers are traceable to authoritative sources and numerically sound
    objective: >
      Retrieved sources carry a tier, an owner, a freshness SLA and a domain; answers
      are checked for fabricated citations, silent source conflicts and uncited
      material claims; and numeric, temporal and entity integrity is verified
      deterministically against the evidence actually retrieved.
    family: NOM-RTG
    pillar: 8
    implemented_by: [P8-1, P8-2, P8-3, P8-4, P8-5]
    evidence_sources: [source_records, findings]
    status_rule:
      kind: presence
      requires: [source_records]
      open_findings_degrade:
        [source_authority, fabricated_citation, source_conflict, integrity_error]
    mappings:
      eu-ai-act: ["Art. 13 — transparency", "Art. 15"]
      nist-ai-rmf: ["MEASURE 2.5", "MEASURE 2.9"]
      iso-42001: ["A.6", "A.7"]
      soc2: ["PI1.1", "CC7.2"]
      owasp-llm: ["LLM09 Misinformation", "LLM08 Vector and Embedding Weaknesses"]

  - key: NOM-RTG-11
    title: Questions outside the declared knowledge boundary are refused, not answered
    objective: >
      Each agent declares the systems of record it reaches, the time range they cover,
      the entity scopes in play and the question types it can answer. Questions outside
      that boundary are answered from a template without reaching the model, answers are
      verified against the boundary after generation, and refusals of answerable
      questions are detected as a counter-metric.
    family: NOM-RTG
    pillar: 7
    implemented_by: [P7-1, P7-2, P7-3, P7-4, P7-6, P7-7]
    evidence_sources: [knowledge_boundaries, decisions]
    status_rule:
      kind: presence
      requires: [knowledge_boundaries]
      open_findings_degrade: [over_refusal, boundary_breach]
    mappings:
      eu-ai-act: ["Art. 13 — transparency", "Art. 15"]
      nist-ai-rmf: ["MEASURE 2.3", "MANAGE 4.1"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      owasp-llm: ["LLM09 Misinformation"]

  - key: NOM-RTG-10
    title: Escalation to a human is governed, not merely available
    objective: >
      Each agent declares the conditions under which it must hand off to a human;
      conversations that met a condition and did not escalate are detected after the
      fact; hand-offs carry complete context, have a named owner and an SLA, and
      resolution claims are checked against what the conversation actually shows.
    family: NOM-RTG
    pillar: 11
    implemented_by: [P11-1, P11-2, P11-3, P11-4, P11-5, P11-6, P11-7]
    evidence_sources: [handoffs, findings]
    status_rule:
      kind: presence
      requires: [handoffs]
      open_findings_degrade: [missed_escalation, handoff_sla_breach, false_resolution]
    mappings:
      eu-ai-act: ["Art. 14 — human oversight", "Art. 50"]
      nist-ai-rmf: ["MANAGE 4.1", "GOVERN 3.2"]
      iso-42001: ["A.9"]
      soc2: ["CC2.2"]
      owasp-llm: ["LLM06 Excessive Agency"]

  - key: NOM-RTG-09
    title: Generated actions are analysed before execution
    objective: >
      SQL, shell and API artefacts generated by an agent are parsed deterministically
      before execution; operation class, blast radius and reversibility are
      established, unbounded and destructive operations are refused, and irreversible
      acts require a verified read from the system of record.
    family: NOM-RTG
    pillar: 9
    implemented_by: [P9-1, P9-2, P9-3, P9-4, P9-5, P9-6, P9-7, P9-10]
    evidence_sources: [decisions, findings]
    status_rule:
      kind: decision_coverage
      surface: tool_args
    mappings:
      eu-ai-act: ["Art. 15", "Art. 14 — human oversight"]
      nist-ai-rmf: ["MANAGE 2.2", "MEASURE 2.6"]
      iso-42001: ["A.6", "A.8"]
      soc2: ["CC7.2", "CC8.1"]
      owasp-llm: ["LLM06 Excessive Agency"]

  - key: NOM-RTG-08
    title: Consumption is bounded and runaway loops are broken
    objective: >
      Per-agent limits on calls, tokens, spend and recursion depth are enforced, and
      runaway tool loops are detected and stopped.
    family: NOM-RTG
    pillar: 3
    implemented_by: [P3-10]
    evidence_sources: [budgets, findings]
    status_rule:
      kind: capability_active
      requires: [budgets]
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MANAGE 2.2"]
      iso-42001: ["A.4"]
      soc2: ["A1.1"]
      owasp-llm: ["LLM10 Unbounded Consumption"]
      owasp-agentic: ["T4 Resource Overload"]

  # --- Pillar 4 · Evaluation & Reliability ------------------------------
  - key: NOM-IAM-08
    title: Inter-agent messages are authenticated and replay-protected
    objective: >
      Inter-agent messages are evaluated on their own surface (not folded into tool
      results), signed and verified where the transport is ours, and rejected on replay;
      unsigned traffic is reported, not silently trusted.
    family: NOM-IAM
    pillar: 17
    implemented_by: [P17-1]
    evidence_sources: [agent_message_log, agent_signing_keys, decisions]
    status_rule:
      kind: decision_coverage
      surface: agent_message
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MANAGE 2.2"]
      iso-42001: ["A.9"]
      soc2: ["CC6.1", "CC6.3"]
      owasp-agentic: ["T12 Agent Communication Poisoning", "T16 Insecure Inter-Agent Protocol Abuse"]

  - key: NOM-RTG-13
    title: Writes to agent memory are validated and carry provenance
    objective: >
      Writes into an agent's long-term memory are validated by the detector pipeline
      before they commit and carry provenance/taint; unverified entries expire rather
      than persisting indefinitely.
    family: NOM-RTG
    pillar: 14
    implemented_by: [P14-7]
    evidence_sources: [memory_entries, decisions]
    status_rule:
      kind: decision_coverage
      surface: memory_write
    mappings:
      eu-ai-act: ["Art. 15"]
      nist-ai-rmf: ["MEASURE 2.7", "MANAGE 2.2"]
      iso-42001: ["A.6", "A.9"]
      soc2: ["CC6.6", "CC6.7"]
      owasp-llm: ["LLM04 Data & Model Poisoning"]
      owasp-agentic: ["T1 Memory Poisoning"]
      mitre-atlas: ["AML.T0020 Poison Training Data"]

  - key: NOM-EVL-01
    title: Changes are evaluated before release and regressions block deployment
    objective: >
      Agent changes are evaluated against a versioned dataset before release, compared
      to a baseline, and regressions beyond tolerance fail the build.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-1, P4-5, P4-6]
    evidence_sources: [eval_runs, eval_results]
    status_rule:
      kind: freshness
      table: eval_runs
      max_age_days: 14
    mappings:
      eu-ai-act: ["Art. 15 — accuracy", "Art. 17"]
      nist-ai-rmf: ["MEASURE 2.3", "MANAGE 4.1"]
      iso-42001: ["A.6 — AI system lifecycle"]
      soc2: ["CC8.1"]

  - key: NOM-EVL-02
    title: Production behaviour is continuously scored and monitored for drift
    objective: >
      Live traffic is sampled, scored with the same scorers used offline, and monitored
      for distribution drift against a declared baseline.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-2]
    evidence_sources: [eval_runs, drift_windows]
    status_rule:
      kind: freshness
      table: drift_windows
      max_age_days: 7
      open_findings_degrade: [drift]
    mappings:
      eu-ai-act: ["Art. 72 — post-market monitoring"]
      nist-ai-rmf: ["MANAGE 4.1", "MEASURE 2.4"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      mitre-atlas: ["AML.T0031 Erode ML Model Integrity"]

  - key: NOM-EVL-03
    title: Plausible-but-incorrect outputs are detected
    objective: >
      Silent failures — confident, well-formed, wrong outputs — are detected using
      groundedness, self-consistency, contract, behavioural, hedging and task-completion
      signals, and surfaced for review.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-3]
    evidence_sources: [eval_results]
    status_rule:
      kind: scorer_active
      scorer: silent_failure
    mappings:
      eu-ai-act: ["Art. 15", "Art. 72"]
      nist-ai-rmf: ["MEASURE 2.3", "MEASURE 2.9"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      owasp-llm: ["LLM09 Misinformation"]
      owasp-agentic: ["T5 Cascading Hallucination", "T7 Misaligned & Deceptive Behaviors"]

  - key: NOM-EVL-04
    title: The system is adversarially tested on a recurring basis
    objective: >
      Adversarial probes across injection, jailbreak, exfiltration, tool abuse and
      policy bypass are run against the deployed configuration and tracked as a
      security posture over time.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-4]
    evidence_sources: [redteam_campaigns, redteam_findings]
    status_rule:
      kind: freshness
      table: redteam_campaigns
      max_age_days: 30
      open_findings_degrade: [redteam]
    mappings:
      eu-ai-act: ["Art. 15 — cybersecurity", "Art. 55 — GPAI systemic risk"]
      nist-ai-rmf: ["MEASURE 2.7", "MANAGE 2.2"]
      iso-42001: ["A.6"]
      soc2: ["CC7.1"]
      owasp-llm: ["LLM01 Prompt Injection", "LLM04 Data and Model Poisoning"]
      owasp-agentic: ["T1 Memory Poisoning"]
      mitre-atlas: ["AML.T0043 Craft Adversarial Data"]

  - key: NOM-EVL-05
    title: Reliability targets are declared and error budgets reported
    objective: >
      Reliability objectives are declared per agent, measured continuously, and error
      budget burn is reported.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-7]
    evidence_sources: [slos]
    status_rule:
      kind: capability_active
      requires: [slos]
    mappings:
      eu-ai-act: ["Art. 15", "Art. 72"]
      nist-ai-rmf: ["MEASURE 2.5", "MANAGE 4.1"]
      iso-42001: ["A.6"]
      soc2: ["A1.1"]

  - key: NOM-EVL-06
    title: Model and provider substitutions are evaluated comparatively
    objective: >
      A change of model or provider is evaluated by running the same suite across both
      before adoption.
    family: NOM-EVL
    pillar: 4
    implemented_by: [P4-8]
    evidence_sources: [eval_runs]
    status_rule:
      kind: capability_active
      requires: [eval_runs]
      optional: true
    mappings:
      eu-ai-act: ["Art. 15", "Art. 25"]
      nist-ai-rmf: ["MEASURE 2.3", "MAP 4.1"]
      iso-42001: ["A.10"]
      soc2: ["CC8.1"]
      owasp-llm: ["LLM03 Supply Chain"]

  # --- Pillar 5 · Audit & Traceability ----------------------------------
  - key: NOM-AUD-01
    title: The complete execution path of every invocation is recorded
    objective: >
      Every prompt, retrieval, tool call and argument, delegation, guardrail decision
      and error is recorded as one correlated execution path.
    family: NOM-AUD
    pillar: 5
    implemented_by: [P5-1, P5-6]
    evidence_sources: [traces, spans]
    status_rule:
      kind: presence
      requires: [traces, spans]
    mappings:
      eu-ai-act: ["Art. 12 — record-keeping and automatic logging"]
      nist-ai-rmf: ["MEASURE 1.1", "MANAGE 4.1"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2"]
      owasp-agentic: ["T8 Repudiation & Untraceability"]

  - key: NOM-AUD-02
    title: Governance events are recorded in a tamper-evident log
    objective: >
      Governance-relevant events are appended to a hash-chained log with signed
      checkpoints whose integrity can be verified independently of the platform.
    family: NOM-AUD
    pillar: 5
    implemented_by: [P5-2]
    evidence_sources: [audit_entries, audit_checkpoints]
    status_rule:
      # Hard signal: a single verification failure is `failing`, never `degraded`.
      # A chain that "mostly" verifies has no evidentiary value at all.
      kind: chain_valid
    mappings:
      eu-ai-act: ["Art. 12", "Art. 19 — automatically generated logs"]
      nist-ai-rmf: ["GOVERN 1.2", "MEASURE 1.1"]
      iso-42001: ["A.6"]
      soc2: ["CC7.2", "CC7.3"]
      owasp-agentic: ["T8 Repudiation & Untraceability"]

  - key: NOM-AUD-03
    title: Evidence for a stated scope can be exported and verified
    objective: >
      A complete, verifiable evidence package for a stated scope and period can be
      produced, with a manifest, chain-of-custody and an independent verifier.
    family: NOM-AUD
    pillar: 5
    implemented_by: [P5-3, P5-7]
    evidence_sources: [evidence_packages]
    status_rule:
      kind: capability_active
      requires: [audit_entries]
    mappings:
      eu-ai-act: ["Art. 12", "Art. 18 — documentation keeping", "Art. 26"]
      nist-ai-rmf: ["GOVERN 1.2"]
      iso-42001: ["A.8 — information for interested parties"]
      soc2: ["CC7.3"]

  - key: NOM-AUD-04
    title: Governance events reach the organisation's existing security monitoring
    objective: >
      Decisions and findings are exported to the organisation's SOC in a format it
      already consumes, without requiring adoption of a new system of record.
    family: NOM-AUD
    pillar: 5
    implemented_by: [P5-4]
    evidence_sources: [decisions, findings]
    status_rule:
      kind: capability_active
      requires: [decisions]
    mappings:
      eu-ai-act: ["Art. 26", "Art. 73 — reporting of serious incidents"]
      nist-ai-rmf: ["MANAGE 4.1"]
      iso-42001: ["A.6"]
      soc2: ["CC7.4 — incident response"]

  - key: NOM-AUD-05
    title: Recorded content is minimised, retained and held per policy
    objective: >
      Sensitive content is redacted at capture, retention is bounded per data class,
      and legal hold suspends deletion for a defined scope.
    family: NOM-AUD
    pillar: 5
    implemented_by: [P5-5]
    evidence_sources: [retention_policies, legal_holds]
    status_rule:
      kind: presence
      requires: [retention_policies]
    mappings:
      eu-ai-act: ["Art. 10", "Art. 19"]
      nist-ai-rmf: ["MANAGE 2.2"]
      iso-42001: ["A.7"]
      soc2: ["CC6.7", "C1.1 — confidentiality"]
      owasp-llm: ["LLM02 Sensitive Information Disclosure"]

  # --- Pillar 6 · Governance & Compliance -------------------------------
  - key: NOM-GOV-01
    title: Governance rules exist as versioned, reviewable code
    objective: >
      Governance rules are authored as versioned, diffable policy that drives both
