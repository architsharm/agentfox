# Golden events for industry/strict, run by `agentfox policy packs test industry/strict`.
# One case per rule: the risk its rule-table entry raises (or the tool it names)
# fires it with the effect its source outcome maps to (deny -> block, escalate ->
# escalate, audit -> allow, recorded). What raises each risk is tested against the
# source policies' own test inputs in tests/platform/packs/test_translated_packs.py.
cases:
- name: industry-strict.credential-pattern-detected-output (deny upstream)
  event:
    surface: output
    action:
      risks:
      - code: industry-strict.credential-pattern-detected-output
        severity: high
  expect:
    verdict: block
    rules:
    - industry-strict.credential-pattern-detected-output
- name: industry-strict.pii-detected-output (deny upstream)
  event:
    surface: output
    action:
      risks:
      - code: industry-strict.pii-detected-output
        severity: high
  expect:
    verdict: block
    rules:
    - industry-strict.pii-detected-output
- name: an ordinary answer passes
  event:
    surface: output
  expect:
    verdict: allow
- name: an ordinary tool call passes
  event:
    surface: tool_args
    tool_key: search.docs
  expect:
    verdict: allow
