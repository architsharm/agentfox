# Golden events for industry/enterprise, run by `agentfox policy packs test industry/enterprise`.
# One case per rule: the risk its rule-table entry raises (or the tool it names)
# fires it with the effect its source outcome maps to (deny -> block, escalate ->
# escalate, audit -> allow, recorded). What raises each risk is tested against the
# source policies' own test inputs in tests/platform/packs/test_translated_packs.py.
cases:
- name: industry-enterprise.file-deletion-not-permitted (deny upstream)
  event:
    surface: tool_args
    tool_key: delete_file
  expect:
    verdict: block
    rules:
    - industry-enterprise.file-deletion-not-permitted
- name: industry-enterprise.code-execution-blocked (deny upstream)
  event:
    surface: tool_args
    tool_key: execute_code
  expect:
    verdict: block
    rules:
    - industry-enterprise.code-execution-blocked
- name: industry-enterprise.ssh-not-permitted (deny upstream)
  event:
    surface: tool_args
    tool_key: ssh_connect
  expect:
    verdict: block
    rules:
    - industry-enterprise.ssh-not-permitted
- name: industry-enterprise.ssn-pattern-detected-output (deny upstream)
  event:
    surface: output
    action:
      risks:
      - code: industry-enterprise.ssn-pattern-detected-output
        severity: high
  expect:
    verdict: block
    rules:
    - industry-enterprise.ssn-pattern-detected-output
- name: industry-enterprise.file-writes-require-approval (escalate upstream)
  event:
    surface: tool_args
    tool_key: write_file
  expect:
    verdict: escalate
    rules:
    - industry-enterprise.file-writes-require-approval
- name: industry-enterprise.email-requires-review (escalate upstream)
  event:
    surface: tool_args
    tool_key: send_email
  expect:
    verdict: escalate
    rules:
    - industry-enterprise.email-requires-review
- name: industry-enterprise.deployments-require-sign-off (escalate upstream)
  event:
    surface: tool_args
    tool_key: deploy
  expect:
    verdict: escalate
    rules:
    - industry-enterprise.deployments-require-sign-off
- name: an ordinary answer passes
  event:
    surface: output
  expect:
    verdict: allow
- name: an ordinary tool call passes
  event:
    surface: tool_args
    tool_key: search.docs
  expect:
    verdict: allow
