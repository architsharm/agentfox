# Golden events for industry/financial, run by `agentfox policy packs test industry/financial`.
# One case per rule: the risk its rule-table entry raises (or the tool it names)
# fires it with the effect its source outcome maps to (deny -> block, escalate ->
# escalate, audit -> allow, recorded). What raises each risk is tested against the
# source policies' own test inputs in tests/platform/packs/test_translated_packs.py.
cases:
- name: industry-financial.credit-card-number-detected (deny upstream)
  event:
    surface: output
    action:
      risks:
      - code: industry-financial.credit-card-number-detected
        severity: high
  expect:
    verdict: block
    rules:
    - industry-financial.credit-card-number-detected
- name: industry-financial.ssn-pattern-detected (deny upstream)
  event:
    surface: output
    action:
      risks:
      - code: industry-financial.ssn-pattern-detected
        severity: high
  expect:
    verdict: block
    rules:
    - industry-financial.ssn-pattern-detected
- name: industry-financial.code-execution-prohibited (deny upstream)
  event:
    surface: tool_args
    tool_key: execute_code
  expect:
    verdict: block
    rules:
    - industry-financial.code-execution-prohibited
- name: industry-financial.financial-transactions-require-compliance-approval (escalate upstream)
  event:
    surface: tool_args
    action:
      risks:
      - code: industry-financial.financial-transactions-require-compliance-approval
        severity: medium
  expect:
    verdict: escalate
    rules:
    - industry-financial.financial-transactions-require-compliance-approval
- name: an ordinary answer passes
  event:
    surface: output
  expect:
    verdict: allow
- name: an ordinary tool call passes
  event:
    surface: tool_args
    tool_key: search.docs
  expect:
    verdict: allow
