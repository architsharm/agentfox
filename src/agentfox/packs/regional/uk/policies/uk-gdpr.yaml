key: uk-gdpr
name: UK GDPR and DPA 2018
description: 'UK GDPR and DPA 2018: rules translated from the uk-gdpr-data-protection policy. Starts in
  observe.'
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents:
  - '*'
rules:
- id: uk-gdpr.block-breach-suppression
  description: 'Art. 33: block breach suppression'
  when:
    action_risk: uk-gdpr.block-breach-suppression
  effect: block
  severity: high
  reason: 'UK GDPR Art. 33: where a breach is likely to result in a risk to rights and freedoms, notify
    the ICO without undue delay and, where feasible, within 72 hours — agent cannot suppress or delay
    notification'
- id: uk-gdpr.block-suppression-individual-notification
  description: 'Art. 34: block suppression of individual notification'
  when:
    action_risk: uk-gdpr.block-suppression-individual-notification
  effect: block
  severity: high
  reason: 'UK GDPR Art. 34: individuals must be informed without undue delay where breach poses high risk'
- id: uk-gdpr.block-unencrypted-personal-data-handling-output
  description: 'Art. 32: block unencrypted personal data handling in output'
  when:
    action_risk: uk-gdpr.block-unencrypted-personal-data-handling-output
  effect: block
  severity: high
  reason: 'UK GDPR Art. 32: personal data must be processed with appropriate technical and organisational
    security measures proportionate to risk (encryption, access control, or equivalent safeguards)'
- id: uk-gdpr.block-complaints-bypass
  description: 'DPA 2018 s.164A: block complaints bypass'
  when:
    action_risk: uk-gdpr.block-complaints-bypass
  effect: block
  severity: high
  reason: 'DPA 2018 s.164A (DUAA): data subjects must be able to raise data protection complaints with
    the controller (30-day acknowledgment) before ICO escalation'
- id: uk-gdpr.nhs-number-output
  description: NHS number in output (compact/spaced/hyphenated; NHS or full "National Health Service")
  when:
    action_risk: uk-gdpr.nhs-number-output
  effect: block
  severity: high
  reason: 'UK GDPR: NHS number detected in agent output — blocked to prevent health identity exposure'
- id: uk-gdpr.national-insurance-number-output
  description: National Insurance number in output (compact AB123456C or HMRC-spaced AB 12 34 56 C)
  when:
    action_risk: uk-gdpr.national-insurance-number-output
  effect: block
  severity: high
  reason: 'UK GDPR: National Insurance number detected in agent output — blocked to prevent identity exposure'
- id: uk-gdpr.block-transfer-without-adequacy-platform-set
  description: 'Art. 44–46: block transfer without adequacy / platform-set DPF (never caller-attested)'
  when:
    action_risk: uk-gdpr.block-transfer-without-adequacy-platform-set
  effect: block
  severity: high
  reason: 'UK GDPR Art. 44–46: transfer to <value> blocked — requires adequacy, IDTA/UK Addendum safeguards,
    and data protection test (DUAA ''not materially lower'' standard)'
- id: uk-gdpr.block-large-exports-without-review
  description: 'Art. 5(1)(c): block large exports without review'
  when:
    action_risk: uk-gdpr.block-large-exports-without-review
  effect: block
  severity: high
  reason: 'UK GDPR Art. 5(1)(c): export of <value> records is disproportionate — requires data minimisation
    review'
- id: uk-gdpr.special-category-health-data
  description: 'Art. 9: special category health data'
  when:
    action_risk: uk-gdpr.special-category-health-data
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 9: health data is special category — requires Art. 9(2) condition and Schedule
    1 DPA basis'
- id: uk-gdpr.other-special-category-data
  description: 'Art. 9: other special category data'
  when:
    action_risk: uk-gdpr.other-special-category-data
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 9: special category personal data detected — explicit consent or Schedule 1 DPA
    condition required'
- id: uk-gdpr.purpose-limitation-language-output
  description: 'Art. 5(1)(b): purpose limitation language in output'
  when:
    action_risk: uk-gdpr.purpose-limitation-language-output
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 5(1)(b): personal data must not be further processed incompatibly — verify compatible
    purpose or DUAA recognised legitimate interests before repurposing'
- id: uk-gdpr.escalate-transfer-action-when-destination-not
  description: 'Art. 44–46: escalate transfer action when destination not specified'
  when:
    action_risk: uk-gdpr.escalate-transfer-action-when-destination-not
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 44–46: cross-border transfer action — confirm adequacy coverage or binding safeguards
    plus documented data protection test before export'
- id: uk-gdpr.cross-border-language-without-structured-params
  description: 'Art. 44: cross-border language without structured params'
  when:
    action_risk: uk-gdpr.cross-border-language-without-structured-params
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 44: restricted transfer language detected — verify adequacy, safeguards, and data
    protection test'
- id: uk-gdpr.bulk-export-actions
  description: 'Art. 5(1)(c): bulk export actions'
  when:
    action_risk: uk-gdpr.bulk-export-actions
  effect: escalate
  severity: medium
  reason: 'UK GDPR Art. 5(1)(c): bulk personal data export requires documented necessity and DPO review'
- id: uk-gdpr.personal-data-access-audit
  description: 'Art. 30: personal data access audit'
  when:
    action_risk: uk-gdpr.personal-data-access-audit
  effect: allow
  severity: low
  reason: 'UK GDPR Art. 5(2) / Art. 30: personal data access logged for accountability and records of
    processing'
- id: uk-gdpr.personal-data-modification-audit
  description: 'Art. 30: personal data modification audit'
  when:
    action_risk: uk-gdpr.personal-data-modification-audit
  effect: allow
  severity: low
  reason: 'UK GDPR Art. 5(2) / Art. 30: personal data modification logged for accountability and records
    of processing'
