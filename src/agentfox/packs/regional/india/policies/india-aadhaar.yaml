key: india-aadhaar
name: Aadhaar Act s.29 and 2021 Regulations
description: 'Aadhaar Act s.29 and 2021 Regulations: rules translated from the aadhaar-pii-protection
  policy. Starts in observe.'
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents:
  - '*'
rules:
- id: india-aadhaar.unmasked-12-digit-aadhaar-output
  description: '2021 Regulations: unmasked 12-digit Aadhaar in output (mask first 8, show last 4)'
  when:
    action_risk: india-aadhaar.unmasked-12-digit-aadhaar-output
  effect: block
  severity: high
  reason: 'Aadhaar Regulations 2021: mask the first 8 of 12 Aadhaar digits (only last 4 may be shown);
    full Aadhaar must not be output, logged, or stored unmasked'
- id: india-aadhaar.unmasked-12-digit-run-near-uid
  description: 'Defence-in-depth: unmasked 12-digit run near UID/UIDAI context'
  when:
    action_risk: india-aadhaar.unmasked-12-digit-run-near-uid
  effect: block
  severity: high
  reason: 'Aadhaar Regulations 2021: unmasked 12-digit Aadhaar number detected near UID context - must
    be masked (last 4 only)'
- id: india-aadhaar.1234-5678-9012-or-1234-5678
  description: 'Standard Aadhaar display formats: 1234 5678 9012 or 1234-5678-9012 (grouped 4-4-4)'
  when:
    action_risk: india-aadhaar.1234-5678-9012-or-1234-5678
  effect: block
  severity: high
  reason: 'Aadhaar Regulations 2021: a grouped 12-digit sequence (4-4-4) resembling an Aadhaar number
    must be masked; only the last 4 digits may be shown'
- id: india-aadhaar.core-biometric-information-never-shared-displayed
  description: 's.29(1): core biometric information never shared/displayed/stored by unauthorised entities'
  when:
    action_risk: india-aadhaar.core-biometric-information-never-shared-displayed
  effect: block
  severity: high
  reason: 'Aadhaar Act s.29(1): core biometric information must never be shared, displayed, or stored
    by unauthorised entities'
- id: india-aadhaar.no-public-display-posting-aadhaar-number
  description: 's.29(4): no public display/posting of Aadhaar number (2019 amendment); s.29(3) purpose
    limitation on disclosure'
  when:
    action_risk: india-aadhaar.no-public-display-posting-aadhaar-number
  effect: block
  severity: high
  reason: 'Aadhaar Act s.29(4): no Aadhaar number shall be published, displayed, or posted publicly (2019
    amendment); s.29(3) bars use or disclosure beyond the specified purpose'
