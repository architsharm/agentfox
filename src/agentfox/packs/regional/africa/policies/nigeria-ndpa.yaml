key: nigeria-ndpa
name: Nigeria NDPA 2023 data residency
description: 'Nigeria NDPA 2023 data residency: rules translated from the ndpa-data-residency policy.
  Starts in observe.'
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents:
  - '*'
rules:
- id: nigeria-ndpa.block-transfer-non-permitted-region
  description: 'NDPA s.25: Block transfer to non-permitted region (structured check)'
  when:
    action_risk: nigeria-ndpa.block-transfer-non-permitted-region
  effect: block
  severity: high
  reason: 'NDPA s.25: Cross-border transfer to <value> blocked - region not in NDPC adequacy-approved
    list'
- id: nigeria-ndpa.block-transfer-non-nigerian-country-code
  description: 'NDPA s.25: Block transfer to non-Nigerian country code (structured check)'
  when:
    action_risk: nigeria-ndpa.block-transfer-non-nigerian-country-code
  effect: block
  severity: high
  reason: 'NDPA s.25: Transfer to country <value> blocked - no documented consent or adequacy basis on
    file'
- id: nigeria-ndpa.block-bulk-data-exports
  description: 'NDPA s.24: Block bulk data exports (data minimisation)'
  when:
    action_risk: nigeria-ndpa.block-bulk-data-exports
  effect: block
  severity: high
  reason: 'NDPA s.24: Bulk personal data export violates data minimisation principle - not permitted without
    documented legal basis'
- id: nigeria-ndpa.block-large-record-exports
  description: 'NDPA s.24: Block large record exports (>1000 records presumptively disproportionate)'
  when:
    action_risk: nigeria-ndpa.block-large-record-exports
  effect: block
  severity: high
  reason: 'NDPA s.24: Export of <value> records is presumptively disproportionate - requires Data Protection
    Officer review'
- id: nigeria-ndpa.block-biometric-data-transmission
  description: 'NDPA Schedule 1: Block biometric data transmission'
  when:
    action_risk: nigeria-ndpa.block-biometric-data-transmission
  effect: block
  severity: high
  reason: 'NDPA Schedule 1: Biometric data detected - must not be transmitted by AI agents without documented
    lawful basis'
- id: nigeria-ndpa.block-breach-suppression
  description: 'NDPA s.22(5): Block breach suppression'
  when:
    action_risk: nigeria-ndpa.block-breach-suppression
  effect: block
  severity: high
  reason: 'NDPA s.22(5): Agent cannot suppress breach notifications - 72-hour NDPC reporting obligation
    applies'
- id: nigeria-ndpa.cross-border-transfer-with-missing-destination
  description: 'NDPA s.25: Cross-border transfer with missing destination info - cannot verify'
  when:
    action_risk: nigeria-ndpa.cross-border-transfer-with-missing-destination
  effect: escalate
  severity: medium
  reason: 'NDPA s.25: Cross-border transfer action with no destination metadata - cannot verify adequacy,
    requires human review'
- id: nigeria-ndpa.detected-cross-border-language-output
  description: 'NDPA s.25: Detected cross-border language in output (defence-in-depth)'
  when:
    action_risk: nigeria-ndpa.detected-cross-border-language-output
  effect: escalate
  severity: medium
  reason: 'NDPA s.25: Cross-border data transfer language detected in output - requires NDPC adequacy
    verification'
- id: nigeria-ndpa.health-medical-data-requires-approval-before
  description: 'NDPA Schedule 1: Health/medical data requires approval before processing'
  when:
    action_risk: nigeria-ndpa.health-medical-data-requires-approval-before
  effect: escalate
  severity: medium
  reason: 'NDPA Schedule 1: Health/medical data detected - sensitive personal data requires explicit lawful
    basis'
- id: nigeria-ndpa.moderate-record-count-requires-approval
  description: 'NDPA s.24: Moderate record count (100–1000) requires approval'
  when:
    action_risk: nigeria-ndpa.moderate-record-count-requires-approval
  effect: escalate
  severity: medium
  reason: 'NDPA s.24: Export of <value> records requires Data Protection Officer approval before execution'
- id: nigeria-ndpa.all-pii-access-must-logged-ndpc
  description: 'NDPA s.30: All PII access must be logged for NDPC accountability'
  when:
    action_risk: nigeria-ndpa.all-pii-access-must-logged-ndpc
  effect: allow
  severity: low
  reason: 'NDPA s.30: Personal data access logged - accountability audit trail for NDPC compliance'
- id: nigeria-ndpa.all-pii-modifications-must-logged
  description: 'NDPA s.30: All PII modifications must be logged'
  when:
    action_risk: nigeria-ndpa.all-pii-modifications-must-logged
  effect: allow
  severity: low
  reason: 'NDPA s.30: Personal data modification logged - accountability audit trail for NDPC compliance'
