key: africa-tool-permissions
name: Restricted tools
description: 'Restricted tools: rules translated from the agent-tool-permissions policy. Starts in observe.'
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents:
  - '*'
rules:
- id: africa-tool-permissions.v-restricted-tool-route-authorization-queue
  description: 'Tool requires human approval: ''%v'' is a restricted tool — route to authorization queue.'
  when:
    action_risk: africa-tool-permissions.v-restricted-tool-route-authorization-queue
  effect: escalate
  severity: medium
  reason: 'Tool requires human approval: <value> is a restricted tool — route to authorization queue.'
