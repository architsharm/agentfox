key: south-africa-popia
name: South Africa POPIA
description: 'South Africa POPIA: rules translated from the popia-south-africa policy. Starts in observe.'
version: 1
mode: observe
default_effect: allow
fail_mode: open
scope:
  agents:
  - '*'
rules:
- id: south-africa-popia.biometric-personal-information-output
  description: 'POPIA s.26(1)(f): Biometric personal information in output'
  when:
    action_risk: south-africa-popia.biometric-personal-information-output
  effect: block
  severity: high
  reason: 'POPIA s.26(1)(f): Biometric personal information detected in agent output — requires documented
    POPIA s.27 exception'
- id: south-africa-popia.children-s-personal-information
  description: 'POPIA s.26(1)(h): Children''s personal information'
  when:
    action_risk: south-africa-popia.children-s-personal-information
  effect: block
  severity: high
  reason: 'POPIA s.26(1)(h): Children''s personal information must not be processed by AI agents without
    a separate consent framework'
- id: south-africa-popia.sa-id-number-detected-output
  description: 'POPIA s.19: SA ID Number (YYMMDD + 7 digits) detected in output'
  when:
    action_risk: south-africa-popia.sa-id-number-detected-output
  effect: block
  severity: high
  reason: 'POPIA s.19: SA ID Number (13-digit) detected in agent output — blocked to prevent sensitive
    identifier exposure'
- id: south-africa-popia.sa-id-number-with-contextual-label
  description: 'POPIA s.19: SA ID Number with contextual label'
  when:
    action_risk: south-africa-popia.sa-id-number-with-contextual-label
  effect: block
  severity: high
  reason: 'POPIA s.19: SA ID Number value detected in agent response — blocked'
- id: south-africa-popia.breach-notification-suppression
  description: 'POPIA s.22: Breach notification suppression'
  when:
    action_risk: south-africa-popia.breach-notification-suppression
  effect: block
  severity: high
  reason: 'POPIA s.22: Agent cannot suppress or delay breach notification — Information Regulator must
    be notified without unreasonable delay'
- id: south-africa-popia.transfer-non-adequate-country-without-consent
  description: 'POPIA s.72: Transfer to non-adequate country without consent (structured params)'
  when:
    action_risk: south-africa-popia.transfer-non-adequate-country-without-consent
  effect: block
  severity: high
  reason: 'POPIA s.72: Transfer to <value> blocked — country not recognised as having substantially similar
    data protection to POPIA'
- id: south-africa-popia.purpose-limitation-processing-beyond-original-consent
  description: 'POPIA s.11: Purpose limitation — processing beyond original consent'
  when:
    action_risk: south-africa-popia.purpose-limitation-processing-beyond-original-consent
  effect: block
  severity: high
  reason: 'POPIA s.11: Purpose limitation — agent cannot process personal information for a purpose beyond
    the original consent'
- id: south-africa-popia.any-cross-border-transfer-action-requires
  description: 'POPIA s.72: Any cross-border transfer action requires Information Officer approval'
  when:
    action_risk: south-africa-popia.any-cross-border-transfer-action-requires
  effect: escalate
  severity: medium
  reason: 'POPIA s.72: Cross-border personal information transfer requires Information Officer approval
    and destination adequacy assessment'
- id: south-africa-popia.cross-border-transfer-language-output
  description: 'POPIA s.72: Cross-border transfer language in output'
  when:
    action_risk: south-africa-popia.cross-border-transfer-language-output
  effect: escalate
  severity: medium
  reason: 'POPIA s.72: Cross-border data transfer language detected — requires Information Officer approval'
- id: south-africa-popia.health-medical-special-personal-information
  description: 'POPIA s.26(1)(e): Health / medical special personal information'
  when:
    action_risk: south-africa-popia.health-medical-special-personal-information
  effect: escalate
  severity: medium
  reason: 'POPIA s.26(1)(e): Health/medical special personal information detected — requires explicit
    lawful basis under POPIA s.27'
- id: south-africa-popia.race-ethnic-origin-special-personal-information
  description: 'POPIA s.26(1)(b): Race / ethnic origin special personal information'
  when:
    action_risk: south-africa-popia.race-ethnic-origin-special-personal-information
  effect: escalate
  severity: medium
  reason: 'POPIA s.26(1)(b): Race/ethnic origin special personal information — requires lawful basis and
    heightened controls'
- id: south-africa-popia.criminal-history-special-personal-information
  description: 'POPIA s.26(1)(g): Criminal history special personal information'
  when:
    action_risk: south-africa-popia.criminal-history-special-personal-information
  effect: escalate
  severity: medium
  reason: 'POPIA s.26(1)(g): Criminal history special personal information — requires explicit lawful
    processing basis'
- id: south-africa-popia.all-personal-information-access-must-logged
  description: 'POPIA s.17: All personal information access must be logged for RESPONSIBLE PARTY accountability'
  when:
    action_risk: south-africa-popia.all-personal-information-access-must-logged
  effect: allow
  severity: low
  reason: 'POPIA s.17: Personal information access logged — RESPONSIBLE PARTY accountability record for
    Information Regulator'
