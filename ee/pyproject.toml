[project]
name = "agentfox-enterprise"
version = "0.1.0"
description = "AgentFox Enterprise: compliance, evidence, fleet monitoring and access checks for the AgentFox control plane."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["agentfox>=0.4.0"]

# How the open core finds this package. Core never imports it (`agentfox.core.extensions`).
[project.entry-points."agentfox.extensions"]
enterprise = "agentfox_ee:extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfox_ee"]
