# Render blueprint for the control-plane UI.
#
# The UI is a pure client of the API (principle X-5), so this deploys one web
# service and no database: the API on Vercel already owns the Neon connection, and
# nothing here talks to Postgres. Point AGENTFOX_API_URL at that API.
#
# Secrets are `sync: false` on purpose — Render prompts for them once at create
# time and stores them itself, so no key is ever committed here.
#
#   Render → New → Blueprint → pick this repo → it reads deploy/render.yaml
#
# After the first deploy, set the GitHub OAuth app's callback URL to
# https://<your-render-host>/api/auth/github/callback, and ADD https://<your-render-host>
# to the API's AGENTFOX_PLAYGROUND_CORS_ORIGIN, which is comma-separated. Replacing the
# value instead of appending fixes this host's playground by breaking the other one's.
# Settings are AGENTFOX_*. A service created from an older copy of this file has
# NOMETRIA_* variables, which are no longer read (the dashboard logs a warning per
# name). Copy each value to its AGENTFOX_* name in the Render
# dashboard and delete the old one: a blueprint sync does not do it for you, since
# secrets here are `sync: false`. docs/deployment/vercel-env-rename.md has the order.
# Full runbook: deploy/README-dashboard.md
services:
  - type: web
    name: nometria-dashboard
    runtime: docker
    # Free so the first deploy needs no card. A free service sleeps when idle, so a
    # cold visitor waits ~30s: move to `starter` before any launch traffic.
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.dashboard
    dockerContext: ./dashboard
    # /login is the one page that renders without a session cookie, so it is the
    # only honest health check: "/" redirects, and every other path 307s to /login.
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Next's standalone server binds to $HOSTNAME, and Render sets that to the pod
      # name — so the app listens on a name its own proxy cannot reach and every
      # request 502s while the logs claim a clean start. Bind to all interfaces.
      - key: HOSTNAME
        value: 0.0.0.0
      # The control plane this UI drives. No trailing slash.
      - key: AGENTFOX_API_URL
        value: https://guardrails-api.vercel.app
      # Sign-in. From the GitHub OAuth app.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Must be byte-identical to the API's AGENTFOX_SERVICE_AUTH_SECRET: it is what
      # authenticates the one privileged call that provisions a new account.
      - key: AGENTFOX_SERVICE_AUTH_SECRET
        sync: false
