# AgentFox — self-hosted control plane.
#
# Self-host is the default and only MVP deployment mode (X-8, P3-8, NFR-4). Nothing
# here reaches the internet at *runtime*: the default model provider is `echo` and
# egress is off. The gateway image (deploy/Dockerfile) carries the weights of the four
# permissive-licence models — Granite Guardian, PIGuard, the protectai ensemble
# backstop and the MiniLM embedding model — so the detectors enabled below never fetch
# anything on first use, and a regulated customer can run the image air-gapped.
#
# The licence-gated Llama Guard tier (`safety.restricted`) is NOT in the image you
# pull: the published image never carries gated weights. It is off by default here
# too. To opt in, after the licence review docs/design/oss-register.md §A.4 calls
# for:
#   1. accept Meta's licence for meta-llama/Llama-Guard-3-8B on Hugging Face,
#   2. build the image yourself with that account's token, which bakes the weights in:
#        export HF_TOKEN=hf_...
#        docker compose -f deploy/docker-compose.yml build gateway
#   3. add "safety.restricted" to AGENTFOX_ENABLED_DETECTORS below, and
#   4. set AGENTFOX_ACCEPT_RESTRICTED_MODEL_LICENSES to "1".
# Without the token the build skips that tier and everything else still builds.
#
#   export AGENTFOX_SERVICE_AUTH_SECRET="$(openssl rand -hex 32)"
#   export AGENTFOX_AUDIT_SIGNING_KEY="$(openssl rand -hex 32)"   # keep a copy
#   docker compose -f deploy/docker-compose.yml up
#
# (Or put both in deploy/.env.) The gateway runs in production and refuses to start on
# a missing or published secret: the service secret authenticates the call that mints
# an owner token, and the signing key is what makes the audit chain tamper-evident.
#
# First operator — no demo data is loaded (the image no longer seeds on boot):
#   docker compose -f deploy/docker-compose.yml exec gateway \
#     agentfox admin users create you@example.com --role owner --token
# then open http://localhost:3000/login → "Self-hosted? Sign in with an API token" and
# paste the token. For demo data instead: `... exec gateway agentfox admin seed`.
#
# Settings are read as AGENTFOX_*. The pre-rename NOMETRIA_* names are still read
# as a deprecated fallback, with a startup warning naming each one; rename them in
# your .env, since a later release stops reading them.
#
#   control plane   http://localhost:3000
#   API + gateway   http://localhost:8080
#   OPA (optional)  http://localhost:8181

name: agentfox

secrets:
  # Backed by the HF_TOKEN environment variable, never written to a file in the
  # repo — `docker compose build` reads it from the shell that invokes it.
  hf_token:
    environment: HF_TOKEN

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentfox
      POSTGRES_PASSWORD: agentfox
      POSTGRES_DB: agentfox
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfox"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Appendix A.1: OPA is the wrapped policy decision engine. It is optional —
  # AGENTFOX_POLICY_ENGINE defaults to `native`, and the OPA adapter falls back to
  # the native evaluator if this container is unreachable, because a policy-engine
  # outage must never take the customer's agent down (NFR-2).
  opa:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error"]
    ports:
      - "8181:8181"

  gateway:
    # Published by .github/workflows/publish-images.yml. Pulled by default; run
    # `docker compose build gateway` to build from source instead.
    image: ghcr.io/architsharm/agentfox/gateway:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      secrets:
        - hf_token
    environment:
      # The password must match POSTGRES_PASSWORD on the db service above.
      AGENTFOX_DATABASE_URL: postgresql+psycopg://agentfox:agentfox@db:5432/agentfox
      AGENTFOX_ORG_ID: org_default
      AGENTFOX_ENVIRONMENT: production
      # Zero egress by default. Set to "true" and supply a key to use a hosted model.
      AGENTFOX_ALLOW_EGRESS: "false"
      AGENTFOX_DEFAULT_PROVIDER: echo
      # The mode used when no bound policy decides. Detector-backed policy is
      # something the customer turns on deliberately, after simulating it (PRD R3).
      # Tool containment still ships enforcing, and a missing grant is refused
      # whatever this says.
      AGENTFOX_DEFAULT_POLICY_MODE: observe
      AGENTFOX_FAIL_MODE: open
      AGENTFOX_ENFORCEMENT_BUDGET_MS: "100"
      AGENTFOX_DETECTOR_TIMEOUT_MS: "40"
      AGENTFOX_POLICY_ENGINE: native
      AGENTFOX_OPA_URL: http://opa:8181
      # Every detector the published image has weights for (deploy/Dockerfile), on
      # top of the 5 zero-dependency defaults. `safety.restricted` (Llama Guard 3-8B)
      # is left out on purpose: see the opt-in steps at the top of this file.
      AGENTFOX_ENABLED_DETECTORS: >-
        ["injection.heuristic","pii.native","secrets.native","safety.lexicon",
        "schema.json","injection.classifier","safety.granite","injection.similarity"]
      # Appendix A.4: Llama Guard's licence is non-OSI (acceptable-use policy, a
      # >700M-MAU clause) and the code refuses to load it unless this is "1". Turning
      # it on is a legal decision, not a technical one, so it ships off.
      AGENTFOX_ACCEPT_RESTRICTED_MODEL_LICENSES: "0"
      # The checkpoint signing key should live outside the application database and be
      # held by the customer (NFR-7, Appendix E.2.2). Required: see the top of this file.
      AGENTFOX_AUDIT_SIGNING_KEY: ${AGENTFOX_AUDIT_SIGNING_KEY:?set AGENTFOX_AUDIT_SIGNING_KEY to a random value (openssl rand -hex 32)}
      # Authenticates the dashboard's GitHub sign-in to the gateway. Required even if
      # you never enable GitHub sign-in: the published default would let anyone mint
      # an owner token. The dashboard below is given the same value.
      AGENTFOX_SERVICE_AUTH_SECRET: ${AGENTFOX_SERVICE_AUTH_SECRET:?set AGENTFOX_SERVICE_AUTH_SECRET to a random value (openssl rand -hex 32)}
      AGENTFOX_EVIDENCE_DIR: /var/agentfox/evidence
      # The public playground page (dashboard/app/(marketing)/playground) calls this origin
      # directly from the visitor's browser, unauthenticated — additive to the
      # hardcoded localhost origins in gateway/app.py, not a replacement. Only
      # needed once the dashboard is actually reachable from somewhere other than
      # this same machine.
      AGENTFOX_PLAYGROUND_CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - evidence:/var/agentfox/evidence
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: ghcr.io/architsharm/agentfox/dashboard:latest
    build:
      context: ../dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    environment:
      # Read at request time, not baked at build time — so one image can be pointed
      # at any control plane.
      AGENTFOX_API_URL: http://gateway:8080
      # Sign-in. The gateway above runs in production, so the development identity
      # header is refused there and every page needs a real operator token. Two ways
      # to get one into the browser:
      #   * an API token, pasted on /login (see "First operator" at the top) — works
      #     with nothing else configured;
      #   * GitHub OAuth: create an OAuth app whose callback is
      #     http://localhost:3000/api/auth/github/callback and export
      #     GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET before `up`. Without them the
      #     GitHub button answers 503 and the token sign-in still works.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AGENTFOX_SERVICE_AUTH_SECRET: ${AGENTFOX_SERVICE_AUTH_SECRET:?set AGENTFOX_SERVICE_AUTH_SECRET}
      # The one deliberate exception to "server-to-server only": the public
      # playground page is a Client Component, so it fetches from the *visitor's
      # browser*, not from this container — it needs an address the browser can
      # reach (the published host port), not the internal Docker DNS name above.
      # Same value as the published `gateway` port mapping below.
      AGENTFOX_PLAYGROUND_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  db-data:
  evidence:
