# Fly.io alternative to deploy/render.yaml — same single web service, same image.
#
# From the repository root:
#
#   fly launch --no-deploy --copy-config --config deploy/fly.dashboard.toml --name <app>
#   fly secrets set --stage --config deploy/fly.dashboard.toml \
#     GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=... AGENTFOX_SERVICE_AUTH_SECRET=...
#   fly deploy ./dashboard --config "$PWD/deploy/fly.dashboard.toml" \
#     --dockerfile "$PWD/deploy/Dockerfile.dashboard"
#
# `./dashboard` is the build context the Dockerfile expects. Guide: deploy/FLY.md
#
# Settings are AGENTFOX_*.
app = "nometria-dashboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.dashboard"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Next's standalone server binds to $HOSTNAME. Where a platform sets that to the
  # machine's name, the server listens on an address its proxy may not reach (every
  # request 502s on Render without this). Bind to all interfaces.
  HOSTNAME = "0.0.0.0"
  AGENTFOX_API_URL = "https://guardrails-api.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    # The only page that renders without a session cookie.
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
