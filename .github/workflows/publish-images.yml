name: Publish images

# Publishes the two runnable images to GitHub Container Registry, which is why the
# repository's Packages section was empty: ci.yml already builds the gateway image on
# every PR (`docker-smoke`) and then throws it away. Nothing ever pushed one.
#
# This matters more than filling in a tab. `deploy/docker-compose.yml` currently
# BUILDS both services, and the gateway build pre-fetches 1-2GB of model weights — so
# the documented "self-host it in one command" path actually costs a first-time user a
# long multi-gigabyte build before they see anything. With these published, compose
# pulls instead, and the README's one-command claim becomes true.
#
# Runs on a release tag, and on main so `:edge` always reflects the default branch.
# Not on pull requests: a fork's PR must never be able to push an image to our registry.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Only what pushing to GHCR needs. `contents: read` because the build reads the repo;
# `packages: write` because it writes exactly one thing.
permissions:
  contents: read
  packages: write

concurrency:
  # A tag and its merge commit can arrive together. Build the later one; there is no
  # value in two identical images racing to the same tag.
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per image per architecture, each on a native runner: the arm64 image is
  # built and boot-checked on arm64 hardware, not under emulation, so "it boots" means
  # the same thing on a Graviton instance as on x86. Each job pushes its image by
  # digest only; `manifest` below gives the pair its tags.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      # One failing image or architecture should not hide whether the others built.
      fail-fast: false
      matrix:
        image:
          - name: gateway
            dockerfile: deploy/Dockerfile
            context: .
          - name: dashboard
            dockerfile: deploy/Dockerfile.dashboard
            context: ./dashboard
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job token, not a PAT. It is scoped to this repository and expires with
          # the run, so there is no long-lived credential to rotate or leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.title=agentfox-${{ matrix.image.name }}
            org.opencontainers.image.description=AgentFox ${{ matrix.image.name }} — runtime firewall for AI agents
            org.opencontainers.image.licenses=Apache-2.0

      # The gateway image carries ~6GB of model weights; the runner's preinstalled
      # toolchains leave too little disk to load it into the local daemon.
      - name: Free disk for the gateway image
        if: matrix.image.name == 'gateway'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Start the finished image before publishing it. ci.yml's docker-smoke stops at
      # the `deps` stage, so nothing ran the image until somebody pulled it — which is
      # how a gateway whose detector warm-up crashed its own startup got this far.
      - name: Build the gateway image locally
        if: matrix.image.name == 'gateway'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: agentfox-gateway:boot-check
          # amd64 keeps the default scope, shared with ci.yml's docker-smoke.
          cache-from: type=gha${{ matrix.arch == 'arm64' && ',scope=arm64' || '' }}

      - name: The gateway image boots
        if: matrix.image.name == 'gateway'
        run: scripts/check/boot_gateway_image.sh agentfox-gateway:boot-check

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha${{ matrix.arch == 'arm64' && ',scope=arm64' || '' }}
          cache-to: type=gha,mode=max${{ matrix.arch == 'arm64' && ',scope=arm64' || '' }}

      - name: Keep the digest for the manifest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag, both architectures: `docker pull` picks the right one for the machine.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [gateway, dashboard]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # `edge` tracks main; a vX.Y.Z tag also moves `latest` and publishes the
          # major.minor so a deployment can pin how precisely it wants to.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Publish the multi-arch tags
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      - name: Both architectures are there
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | sed 's/.*://')"
          docker buildx imagetools inspect "${image}:${tag}" | tee /tmp/inspect
          grep -q "linux/amd64" /tmp/inspect && grep -q "linux/arm64" /tmp/inspect
