name: Run monitors

# The hosted job runner (`/api/internal/jobs/run`) is triggered by a Vercel cron, and
# Vercel's Hobby tier allows that once a day. Monitors of connected sources (GitHub
# repositories, hosted-API specs, MCP servers) are meant to run every few hours, so this
# calls the same endpoint every 30 minutes. Each monitor still keeps its own interval:
# the runner only runs what is due, so calling it more often never runs anything twice.
#
# This is also what drives the public /live showcase (`apps/showcase.py`, probes due
# hourly): without it the showcase only runs on the daily Vercel cron and on traffic.
#
# Configure (Settings → Secrets and variables → Actions):
#   AGENTFOX_API_URL      the API's base URL, e.g. https://api.example.com. A secret or
#                         a repository variable; it is not sensitive. On the upstream
#                         repository it defaults to the hosted gateway.
#   AGENTFOX_CRON_SECRET  the deployment's cron secret (its CRON_SECRET or
#                         AGENTFOX_CRON_SECRET value)
# With neither (a fork, a fresh clone) the job says so and exits successfully. With the
# secret but no URL it fails: that half-configured state ran as a green no-op every
# time from the day this workflow was added, and /live went stale behind it.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: run-monitors
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the job runner
        env:
          API_URL: ${{ secrets.AGENTFOX_API_URL || vars.AGENTFOX_API_URL || (github.repository == 'architsharm/agentfox' && 'https://guardrails-api.vercel.app' || '') }}
          CRON_SECRET: ${{ secrets.AGENTFOX_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "AGENTFOX_CRON_SECRET is not set; nothing to run."
            exit 0
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::AGENTFOX_CRON_SECRET is set but AGENTFOX_API_URL is not; the job runner was not called."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 290 \
            --retry 2 --retry-delay 20 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${API_URL%/}/api/internal/jobs/run"
          echo
