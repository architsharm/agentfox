name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (matches the documented dev venv, not --all-extras)
        run: uv sync --extra pii --extra classifiers --extra otel --extra postgres --extra sql --extra dev
      - run: uv run pytest -q
      # The operator plugins (plugins/) and Appendix C are checked against the live code, so
      # neither can silently drift. Both also run inside pytest (tests/repo/test_plugins.py);
      # these steps just make the failure obvious in the job log.
      - name: Plugins match the live CLI, repo paths and docs map, and their shared copies
        run: uv run python scripts/check_plugins.py
      - name: Appendix C route tables match the running app
        run: uv run python scripts/api_routes.py --check
      - name: Docs site reference is current and its commands exist
        run: uv run python scripts/docs_reference.py --check
      - name: Every published number still matches the result it came from
        run: uv run python scripts/claims.py --check

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  # Builds only through the `deps` stage (deploy/Dockerfile) — everything past it
  # downloads ~1-2GB of model weights and needs a Hugging Face token, neither of
  # which belongs in a per-push check. `deps` still catches what actually broke
  # production once already: COPY paths that don't exist, or an extras install that
  # no longer covers what the app imports.
  # Added after a sweep that cleared 397 findings — among them two undefined
  # names (`Any` in the coverage probe, `GuardState` in a test, both latent
  # only because `from __future__ import annotations` defers evaluation), a
  # dead `used_fallback`, and three unused variables in tests that could as
  # easily have been forgotten assertions. None of it gated anything, because
  # nothing ran ruff. Cheap enough to run on every push that there is no
  # reason it should not.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, and pinned to the version the repo was actually cleaned with.
      # `ruff format` output differs between releases, so an unpinned
      # `--check` here would fail on a day nobody changed anything.
      - name: Ruff — the rules, from pyproject
        run: uvx ruff@0.15.7 check .
      - name: Ruff — formatting, unchanged
        run: uvx ruff@0.15.7 format --check .
      # The layer rule and the "core imports nothing outside core" rule, from the
      # [tool.importlinter] contracts in pyproject. Static analysis only: the package
      # is found on PYTHONPATH and nothing is installed or imported.
      - name: Import contracts — layers hold
        run: PYTHONPATH=src uvx --from import-linter==2.15 lint-imports

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: deps
          push: false

  # Belt-and-suspenders for the local pre-commit hook (.pre-commit-config.yaml):
  # catches the case where src/agentfox/ changed and the vendored wheel(s) didn't,
  # e.g. a commit made with --no-verify. This is what let guardrails-api and the
  # redteam demo silently run stale code in production before this existed.
  vendored-wheel-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if src/agentfox changed without rebuilding the vendored wheels
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base commit to diff against (e.g. first push on a new branch) — skipping"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -q '^src/agentfox/' \
             && ! echo "$CHANGED" | grep -qE '^(api|demo/redteam-live-lang)/vendor/.*\.whl$'; then
            echo "src/agentfox/ changed but the vendored wheel(s) weren't rebuilt alongside it."
            echo "Run: uv build --wheel --out-dir api/vendor && uv build --wheel --out-dir demo/redteam-live-lang/vendor"
            echo "(the local pre-commit hook does this automatically — see .pre-commit-config.yaml)"
            exit 1
          fi
